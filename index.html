<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --steel: #e8ecf0;
    --panel: #ffffff;
    --ink: #17222e;
    --muted: #5b6876;
    --faint: #8a95a2;
    --line: #d5dce3;
    --console: #1c2a39;
    --console-2: #26384b;
    --console-ink: #e9eef3;
    --console-muted: #9fb0c1;
    --amber: #f2b01e;
    --amber-ink: #1c2a39;
    --blue: #2f6db0;
    --blue-soft: #e3ecf6;
    --ok: #2b8a57;
    --ok-soft: #e2f2e9;
    --err: #b8382f;
    --err-soft: #f8e5e3;
    --hold: #8a6d1d;
    --hold-soft: #f7efd8;
    --cjk: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    --display: "Barlow", "Segoe UI", system-ui, var(--cjk);
    --cond: "Barlow Semi Condensed", "Barlow", "Segoe UI", var(--cjk);
    --body: "Source Sans 3", "Segoe UI", system-ui, var(--cjk);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --steel: #121a22; --panel: #1a242f; --ink: #e6ebf0; --muted: #9aa7b4; --faint: #6f7d8b; --line: #2b3845;
      --console: #0e161e; --console-2: #1b2836; --blue: #6fa3dc; --blue-soft: #1d2e42;
      --ok: #5fc58d; --ok-soft: #173225; --err: #ee7d74; --err-soft: #3a1d1b; --hold: #e2c065; --hold-soft: #33290f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--steel); color: var(--ink); font: 16px/1.5 var(--body); }
  html[lang="zh-Hant"] body { line-height: 1.6; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

  /* ---------- header ---------- */
  header.top { padding: 28px 0 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header.top h1 { margin: 0; font: 700 30px/1.1 var(--display); letter-spacing: -0.01em; }
  header.top p { margin: 6px 0 0; color: var(--muted); }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sim-status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 12px; }
  .sim-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .sim-status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .sim-status.busy .dot { background: var(--amber); box-shadow: 0 0 0 3px var(--hold-soft); }
  .sim-status.off .dot { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
  .lang button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--console); color: #fff; font-weight: 600; }
  .demo { margin: 0 0 18px; background: var(--hold-soft); color: var(--hold); border-radius: 8px; padding: 10px 14px; font-size: 14px; }

  /* ---------- layout ---------- */
  main.grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 22px; align-items: start; padding-bottom: 48px; }
  .col { display: grid; gap: 22px; min-width: 0; }
  .col > * { min-width: 0; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  h2 { margin: 0 0 16px; font: 600 19px/1.2 var(--display); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; }

  /* ---------- scenario form ---------- */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .field label .opt { font-weight: 400; color: var(--faint); }
  .field input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--steel); font-size: 16px; }
  .field input:hover { border-color: var(--faint); }
  .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); background: var(--panel); }
  .field small { display: block; color: var(--muted); font-size: 13px; margin-top: 5px; }
  .field.invalid input { border-color: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  .period-days { font: 600 15px var(--cond); color: var(--muted); margin: -4px 0 18px; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 20px 0 18px; }
  .err-box { background: var(--err-soft); color: var(--err); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }

  /* ---------- console (signature) ---------- */
  .console { background: var(--console); color: var(--console-ink); border-radius: 14px; padding: 20px 22px 22px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .ctl { display: inline-flex; align-items: center; gap: 9px; height: 52px; padding: 0 20px; border-radius: 10px;
    border: 1px solid #3a4f66; background: var(--console-2); color: var(--console-ink); cursor: pointer;
    font: 600 16px var(--display); letter-spacing: 0.01em; transition: background .15s, transform .05s; }
  .ctl svg { width: 20px; height: 20px; flex: none; }
  .ctl:hover:not(:disabled) { background: #314760; }
  .ctl:active:not(:disabled) { transform: translateY(1px); }
  .ctl:disabled { opacity: .38; cursor: not-allowed; }
  .ctl.run { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); padding: 0 26px; }
  .ctl.run:hover:not(:disabled) { background: #ffc23d; }
  .ctl.stop:not(:disabled) { color: #ffb4ad; border-color: #6b3a3a; }
  .ctl.stop:hover:not(:disabled) { background: #4a2c2e; }
  .controls .spacer { flex: 1; }
  .ctl:focus-visible { outline-color: var(--amber); }

  .state { display: flex; align-items: center; gap: 12px; margin: 22px 0 14px; min-height: 28px; }
  .state .tag { font: 600 13px var(--display); letter-spacing: .02em; padding: 4px 11px; border-radius: 6px; background: var(--console-2); color: var(--console-muted); white-space: nowrap; }
  .state .tag.running { background: var(--amber); color: var(--amber-ink); }
  .state .tag.done { background: #23553d; color: #c6f0d7; }
  .state .tag.error { background: #5a2a28; color: #ffc9c3; }
  .state .tag.wait { background: #3a4c60; color: #dbe6f1; }
  .state .msg { color: var(--console-ink); font-size: 15px; }
  .state .msg .sub { color: var(--console-muted); }

  .timeline { position: relative; padding-top: 4px; }
  .track { position: relative; height: 10px; border-radius: 5px; background: var(--console-2); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #3d7fc4, #6fb0ef); border-radius: 5px; transition: width .8s ease; }
  .fill.complete { background: #3fa46e; }
  .ticks { position: relative; height: 22px; margin-top: 6px; }
  .tick { position: absolute; top: 0; transform: translateX(-50%); font: 500 12px var(--cond); color: var(--console-muted); white-space: nowrap; }
  .tick::before { content: ""; position: absolute; left: 50%; top: -12px; width: 1px; height: 6px; background: #4a6079; }
  .ends { display: flex; justify-content: space-between; font: 600 15px var(--display); margin-bottom: 8px; }
  .ends span:last-child { text-align: right; }
  .ends small { display: block; font: 400 12px var(--body); color: var(--console-muted); }
  @media (prefers-reduced-motion: reduce) { .fill, .bar-fill { transition: none; } .spin { animation: none !important; } }
  .spin { width: 16px; height: 16px; border: 2px solid #4a6079; border-top-color: var(--amber); border-radius: 50%; animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- results ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
  .kpi { padding: 16px 18px 4px 0; }
  .kpi .k { color: var(--muted); font-size: 14px; }
  .kpi .v { font: 600 40px/1.05 var(--cond); letter-spacing: -0.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font: 500 15px var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .kpi .d { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 18px; }
  .kpi .d.up { color: var(--ok); } .kpi .d.down { color: var(--err); }
  .results-meta { color: var(--muted); font-size: 14px; margin: -8px 0 14px; }
  .live-tag { display: inline-block; vertical-align: middle; margin-left: 10px; font: 600 12px var(--display); letter-spacing: .02em;
    color: var(--amber-ink); background: var(--amber); padding: 3px 9px; border-radius: 5px; }
  .live-tag::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--amber-ink); margin-right: 6px; vertical-align: 1px; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .live-tag::before { animation: none; } }
  .spark { display: block; width: 100%; max-width: 220px; height: 34px; margin-top: 8px; overflow: visible; }
  .spark polyline { fill: none; stroke: var(--blue); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .empty { color: var(--muted); padding: 18px 0 6px; }

  select { height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--steel); }
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 200px) minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 14px; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .bar-track { background: var(--steel); border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: #a9c4e2; border-radius: 4px; transition: width .4s; }
  .bar-row.current .bar-fill { background: var(--blue); }
  .bar-row.current .name { color: var(--ink); font-weight: 600; }
  .bar-row .val { white-space: nowrap; text-align: right; font: 600 15px var(--cond); font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; margin: 0 -22px; padding: 0 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  th.l, td.l { text-align: left; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--steel); }
  tr.selected td { background: var(--blue-soft); }
  .pill { font: 600 12px var(--display); padding: 3px 9px; border-radius: 5px; letter-spacing: .02em; }
  .pill.done { background: var(--ok-soft); color: var(--ok); }
  .pill.error { background: var(--err-soft); color: var(--err); }
  .pill.wait { background: var(--hold-soft); color: var(--hold); }
  .pill.running { background: var(--blue-soft); color: var(--blue); }
  .link { border: 0; background: none; color: var(--blue); padding: 0; cursor: pointer; font-weight: 600; font-size: 14px; }

  /* ---------- connect ---------- */
  .connect { max-width: 560px; margin: 8px auto 60px; }
  .connect p, .connect ol { color: var(--muted); }
  .connect ol { padding-left: 20px; margin: 0 0 20px; }
  .connect li { margin-bottom: 4px; }
  .connect code { background: var(--steel); padding: 1px 6px; border-radius: 4px; color: var(--ink); }
  .btn-primary { height: 48px; width: 100%; border: 0; border-radius: 10px; background: var(--console); color: #fff; font: 600 16px var(--display); cursor: pointer; }

  @media (max-width: 900px) {
    main.grid { grid-template-columns: 1fr; }
    .wrap { padding: 0 16px; }
    .ctl { height: 48px; padding: 0 16px; }
    .ctl.run { padding: 0 20px; }
    .controls .spacer { display: none; }
  }
  @media (max-width: 520px) {
    .ctl span { display: none; }
    .ctl, .ctl.run { padding: 0 16px; flex: 1; justify-content: center; }
    .kpi .v { font-size: 34px; }
    .bar-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
    .bar-row .name { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Production Simulator</h1>
      <p id="subtitle" data-i18n="loading">Loading…</p>
    </div>
    <div class="top-right">
      <div id="simStatus" class="sim-status" hidden><span class="dot"></span><span id="simStatusText"></span></div>
      <div class="lang" role="group" aria-label="Language / 語言">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
      </div>
    </div>
  </header>
  <div class="demo" id="mockBanner" data-i18n="demo" hidden></div>

  <section class="panel connect" id="connectCard" hidden>
    <h2 data-i18n="connectTitle"></h2>
    <p data-i18n="connectBody"></p>
    <ol>
      <li data-i18n="connectStep1"></li>
      <li data-i18n-html="connectStep2"></li>
      <li data-i18n="connectStep3"></li>
    </ol>
    <button class="btn-primary" id="connectBtn" type="button" data-i18n="chooseFolder"></button>
    <div id="connectError" class="err-box" hidden></div>
  </section>

  <main class="grid" id="app" hidden>
    <section class="panel">
      <h2 data-i18n="scenario"></h2>
      <form id="form" novalidate>
        <div id="fields"></div>
        <div class="period-days" id="periodDays"></div>
        <hr class="sep">
        <div class="field">
          <label for="f_label"><span data-i18n="scenarioName"></span> <span class="opt" data-i18n="optional"></span></label>
          <input id="f_label" maxlength="60" data-i18n-placeholder="scenarioPh">
        </div>
        <div class="field">
          <label for="f_who"><span data-i18n="yourName"></span> <span class="opt" data-i18n="optional"></span></label>
          <input id="f_who" maxlength="60">
        </div>
        <div id="formError" class="err-box" hidden></div>
      </form>
    </section>

    <div class="col">
      <section class="console" data-i18n-aria="controlsAria">
        <div class="controls">
          <button type="button" class="ctl" id="btnReset" data-i18n-title="resetTip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            <span data-i18n="reset"></span></button>
          <button type="button" class="ctl run" id="btnRun" data-i18n-title="runTip">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
            <span data-i18n="run"></span></button>
          <button type="button" class="ctl" id="btnFast" data-i18n-title="fastTip">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 5.2v13.6a.8.8 0 0 0 1.25.66L12 13.6v5.2a.8.8 0 0 0 1.25.66l9.4-6.8a.8.8 0 0 0 0-1.32l-9.4-6.8A.8.8 0 0 0 12 5.2v5.2L3.75 4.54A.8.8 0 0 0 2.5 5.2z"/></svg>
            <span data-i18n="fast"></span></button>
          <div class="spacer"></div>
          <button type="button" class="ctl stop" id="btnStop" data-i18n-title="stopTip" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            <span data-i18n="stop"></span></button>
        </div>

        <div class="state" id="state" aria-live="polite"></div>

        <div class="timeline">
          <div class="ends"><span id="endStart">—</span><span id="endEnd">—</span></div>
          <div class="track"><div class="fill" id="fill"></div></div>
          <div class="ticks" id="ticks"></div>
        </div>
      </section>

      <section class="panel">
        <h2 id="resultsTitle"></h2>
        <div class="results-meta" id="resultsMeta" hidden></div>
        <div id="kpis" class="kpis"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="compare"></h2>
          <select id="metricSel" data-i18n-aria="metricAria"></select>
        </div>
        <div id="bars" class="bars"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="history"></h2>
          <button class="link" id="csvBtn" type="button" data-i18n="csv"></button>
        </div>
        <div class="table-wrap"><table id="hist"></table></div>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  const ACTIVE = ["submitted", "queued", "running"];

  // =====================================================================
  // 語言 / Language
  // =====================================================================
  const I18N = {
    en: {
      loading: "Loading…",
      demo: "Demo mode: results are test data, not FlexSim output.",
      connectTitle: "Connect to the shared folder",
      connectBody: "This simulator runs through a shared OneDrive folder. Your browser needs permission to read and write it.",
      connectStep1: "Click the button below.",
      connectStep2: "Choose the <code>FlexSimShare</code> folder (the one that contains this page).",
      connectStep3: "When the browser asks, allow it to view and edit files.",
      chooseFolder: "Choose shared folder",
      reconnect: "Reconnect to “{name}”",
      errBrowser: "This browser can't open local folders. Open this file in Microsoft Edge or Google Chrome.",
      errWrongFolder: "“{name}” isn't the simulator folder (config.json not found). Choose the FlexSimShare folder.",
      errNoConfig: "config.json wasn't found in this folder. Choose the FlexSimShare folder, and make sure the simulator PC has been started at least once.",
      scenario: "Scenario",
      startDate: "Start date", endDate: "End date",
      dateHelp: "Both dates must be in the same year. The run includes the whole end date.",
      calDays: "{n} calendar days",
      scenarioName: "Scenario name", yourName: "Your name", optional: "(optional)", scenarioPh: "e.g. Q4 peak season",
      range: "Range {min} to {max}.",
      controlsAria: "Simulation controls",
      reset: "Reset", run: "Run", fast: "Fast forward", stop: "Stop",
      resetTip: "Restore the default inputs and clear the results view",
      runTip: "Run the simulation and show progress",
      fastTip: "Run straight to the end without progress updates",
      stopTip: "Stop the run in progress",
      idle: "Idle", idleMsg: "Set the period and press Run.", resetMsg: "Inputs restored to defaults.",
      sent: "Sent", sentMsg: "Waiting for OneDrive to deliver the request.", sentSub: "Usually under a minute.",
      queued: "Queued", queuePos: "Position {n} in line.", queueNext: "Next in line.",
      running: "Running", starting: "Starting FlexSim.",
      ffMsg: "Running to the end date.", ffSub: "No progress updates in this mode.",
      warming: "Warming up: simulated through {date}, before the period starts.",
      through: "Simulated through {date}.", pctModel: "{p}% of model time",
      finished: "Finished", finishedMsg: "Finished {when}.", took: "Took {s} s.",
      stopped: "Stopped", failed: "Failed", failedMsg: "The run failed.",
      stopping: "Stopping", stoppingMsg: "Sending the stop request.", stoppingSub: "It takes effect once OneDrive syncs.",
      confirmStop: "Stop this run? FlexSim will be closed and no results will be saved.",
      startLbl: "Start", endLbl: "End",
      results: "Results", resultsEmpty: "Results appear here when a run finishes.",
      liveTag: "Live", liveMeta: "Live values, simulated through {date}. Updates about every 10 seconds.", liveWait: "Live values appear once the model has run for a moment.",
      runBy: ", run by {who}",
      same: "Same as previous run", up: "Up {p}% from previous run", down: "Down {p}% from previous run",
      compare: "Compare runs", compareEmpty: "Finished runs appear here side by side.", metricAria: "Metric to compare",
      history: "Run history", csv: "Download CSV", noRuns: "No runs yet.",
      thScenario: "Scenario", thBy: "By", thStatus: "Status", thPeriod: "Period",
      pSent: "Sent", pQueued: "Queued", pRunning: "Running", pDone: "Done", pStopped: "Stopped", pFailed: "Failed", ffTag: "FF",
      runOf: "Run of {when}",
      simNever: "Simulator has not connected yet", simBusy: "Simulator busy", simBusyQ: "Simulator busy, {n} waiting",
      simOn: "Simulator online, checked {ago}", simOff: "Simulator offline, last seen {ago}",
      sAgo: "{n} s ago", mAgo: "{n} min ago", hAgo: "{n} h ago", dAgo: "{n} days ago",
      eStart: "Choose a start date.", eEnd: "Choose an end date.", eYear: "Start and end dates must be in the same year.",
      eOrder: "The end date is before the start date.", eRange: "{label} must be between {min} and {max}.",
    },
    zh: {
      loading: "載入中…",

  const ERR_ZH = [
    [/^Cancelled before it started$/, "開始前已取消"],

    [/^Stopped on the simulator PC/, "模擬電腦在跑完前停止了，請重新執行。"],

  let LANG = load("simLang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
  function t(key, vars) {
    let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
    return s;
  }
  const L = (obj, field) => (LANG === "zh" && obj?.[field + "_zh"]) || obj?.[field] || "";
  function errText(msg) {
    if (!msg) return t("failedMsg");
    if (LANG !== "zh") return msg;
    for (const [re, zh] of ERR_ZH) if (re.test(msg)) return msg.replace(re, zh);
    return msg;
  }
  const locale = () => LANG === "zh" ? "zh-TW" : "en-US";

  function applyStatic() {
    document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });

  // =====================================================================
  // 共用資料夾存取（OneDrive 中轉）
  // =====================================================================
  const IDB_NAME = "flexsim-web", IDB_STORE = "handles";
  function idb(mode, fn) {
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(IDB_NAME, 1); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => {
        try {
          const tx = req.result.transaction(IDB_STORE, mode);
          const r = fn(tx.objectStore(IDB_STORE));
          tx.oncomplete = () => resolve(r && r.result);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        } catch (e) { reject(e); }
      };
    });
  }
  const saveHandle = (h) => idb("readwrite", s => s.put(h, "share")).catch(() => {});
  const loadHandle = () => idb("readonly", s => s.get("share")).catch(() => null);

  function folderTransport(root) {
    let lastStatus = null;

    async function readJson(dir, name) {
      try {
        const d = dir ? await root.getDirectoryHandle(dir) : root;
        const fh = await d.getFileHandle(name);
        const text = await (await fh.getFile()).text();
        return JSON.parse(text);
      } catch (e) { return null; }  // 不存在、或 OneDrive 還在同步
    }
    async function writeJson(dir, name, data) {
      const d = await root.getDirectoryHandle(dir, { create: true });
      const fh = await d.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(data, null, 2));
      await w.close();
    }
    async function listIds(dir) {
      const ids = [];
      try {
        const d = await root.getDirectoryHandle(dir);
        for await (const [name, h] of d.entries()) {
          if (h.kind === "file" && /^[A-Za-z0-9_-]{1,64}\.json$/.test(name)) ids.push(name.slice(0, -5));
        }
      } catch (e) {}
      return ids;
    }
    function newId() {
      const t = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
      const r = Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, "0")).join("");
      return `${t}-${r}`;
    }
    async function status() { lastStatus = await readJson(null, "status.json"); return lastStatus; }
    async function merge(id, jobFile) {
      const res = await readJson("results", `${id}.json`);
      if (res) return res;
      const job = jobFile || await readJson("jobs", `${id}.json`);
      if (!job) return null;
      const q = lastStatus?.queue || [];
      const pos = q.indexOf(id);
      return { ...job, id, status: pos >= 0 ? "queued" : "submitted", queue_position: pos >= 0 ? pos + 1 : null };
    }
    return {
      kind: "folder",
      pollMs: 3000,
      async getConfig() {
        const c = await readJson(null, "config.json");
        if (!c) throw new Error(t("errNoConfig"));
        return c;
      },
      async submit(job) {
        const id = newId();
        const data = { ...job, id, submitted_at: new Date().toISOString() };
        await writeJson("jobs", `${id}.json`, data);
        return { ...data, status: "submitted" };
      },
      async getJob(id) { await status(); return (await merge(id)) || { id, status: "submitted" }; },
      async cancel(id) { await writeJson("cancel", `${id}.json`, { id, cancelled_at: new Date().toISOString() }); },
      async history() {
        await status();
        const ids = (await listIds("jobs")).sort().reverse().slice(0, 50);
        const out = [];
        for (const id of ids) { const j = await merge(id); if (j) out.push(j); }
        return out;
      },
      simStatus: status,
    };
  }

  async function connectFolder() {
    const unsupported = !("showDirectoryPicker" in window);
    $("connectCard").hidden = false;
    $("subtitle").textContent = "";
    if (unsupported) {
      $("connectBtn").hidden = true;
      $("connectError").textContent = t("errBrowser");
      $("connectError").hidden = false;
      return new Promise(() => {});
    }
    const saved = await loadHandle();
    let reconnecting = false;
    if (saved) {
      try {
        if (await saved.queryPermission({ mode: "readwrite" }) === "granted") { $("connectCard").hidden = true; return saved; }
        $("connectBtn").textContent = t("reconnect", { name: saved.name }); reconnecting = true;
      } catch (e) {}
    }
    return new Promise((resolve) => {
      $("connectBtn").onclick = async () => {
        $("connectError").hidden = true;
        try {
          let h = null;
          if (saved && reconnecting) {
            if (await saved.requestPermission({ mode: "readwrite" }) === "granted") h = saved;
          }
          if (!h) h = await window.showDirectoryPicker({ id: "flexsim-share", mode: "readwrite" });
          try { await h.getFileHandle("config.json"); }
          catch (e) { throw new Error(t("errWrongFolder", { name: h.name })); }
          await saveHandle(h);
          $("connectCard").hidden = true;
          resolve(h);
        } catch (e) {
          if (e.name === "AbortError") return;
          $("connectBtn").textContent = t("chooseFolder"); reconnecting = false;
          $("connectError").textContent = e.message;
          $("connectError").hidden = false;
        }
      };
    });
  }

  // =====================================================================
  let T = null, CFG = null, DI = null, history = [], selectedId = null, activeId = null, pollTimer = null;
  let shownJob = null, stateMode = "idle";

  // ---------- formatting ----------
  const pad = (n) => String(n).padStart(2, "0");
  function fmt(v, decimals = 1, group = true) {
    if (v === null || v === undefined || Number.isNaN(Number(v))) return "—";
    return Number(v).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals, useGrouping: group });
  }
  const parseDay = (s) => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const isoDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayFmt = (d, year = true) => d.toLocaleDateString(locale(), year ? { month: "short", day: "numeric", year: "numeric" } : { month: "short", day: "numeric" });
  const when = (iso) => iso ? new Date(iso).toLocaleString(locale(), { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return t("sAgo", { n: Math.round(s) });
    if (s < 5400) return t("mAgo", { n: Math.round(s / 60) });
    if (s < 172800) return t("hAgo", { n: Math.round(s / 3600) });
    return t("dAgo", { n: Math.round(s / 86400) });
  }
  const runName = (j) => j.label || t("runOf", { when: when(j.submitted_at) || "?" });
  const isStopped = (j) => j.status === "error" && /^(Cancelled|Interrupted|Stopped)/.test(j.error || "");

  // ---------- period helpers (date pickers ↔ year / month / day parameters) ----------
  function periodOf(params) {
    if (!DI || !params) return null;
    const y = params[DI.year], sm = params[DI.start_month], sd = params[DI.start_day], em = params[DI.end_month], ed = params[DI.end_day];
    if ([y, sm, sd, em, ed].some(v => v == null || Number.isNaN(Number(v)))) return null;
    return { start: new Date(y, sm - 1, sd), end: new Date(y, em - 1, ed) };
  }
  function periodLabel(params) {
    const p = periodOf(params);
    return p ? `${dayFmt(p.start, false)} – ${dayFmt(p.end)}` : "—";
  }
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);

  // ---------- form ----------
  const otherParams = () => CFG.parameters.filter(p => !DI || !Object.values(DI).includes(p.name));
  const defaults = () => Object.fromEntries(CFG.parameters.map(p => [p.name, p.default]));

  function buildForm(values) {
    let html = "";
    if (DI) {
      const p = periodOf(values) || periodOf(defaults());
      html += `
        <div class="field" data-kind="date">
          <label for="d_start">${esc(t("startDate"))}</label>
          <input id="d_start" type="date" value="${isoDay(p.start)}" ${DI.min ? `min="${esc(DI.min)}"` : ""}>
        </div>
        <div class="field" data-kind="date">
          <label for="d_end">${esc(t("endDate"))}</label>
          <input id="d_end" type="date" value="${isoDay(p.end)}" ${DI.min ? `min="${esc(DI.min)}"` : ""}>
          <small>${esc(t("dateHelp"))}</small>
        </div>`;
    }
    html += otherParams().map(p => {
      const unit = L(p, "unit");
      return `
      <div class="field" data-kind="num">
        <label for="p_${esc(p.name)}">${esc(L(p, "label"))}${unit ? ` <span class="opt">(${esc(unit)})</span>` : ""}</label>
        <input id="p_${esc(p.name)}" type="number" inputmode="decimal" value="${esc(values?.[p.name] ?? p.default)}"
          min="${esc(p.min)}" max="${esc(p.max)}" step="${esc(p.step ?? "any")}">
        <small>${esc(L(p, "help"))}${p.min !== undefined ? ` ${esc(t("range", { min: p.min, max: p.max }))}` : ""}</small>
      </div>`; }).join("");
    $("fields").innerHTML = html;
    document.querySelectorAll("#fields input").forEach(i => i.addEventListener("input", () => { updatePeriodPreview(); $("formError").hidden = true; }));
    updatePeriodPreview();

  function readForm() {
    const params = {}; let error = null;
    document.querySelectorAll("#fields .field").forEach(f => f.classList.remove("invalid"));
    if (DI) {
      const s = $("d_start").value, e = $("d_end").value;
      if (!s) { $("d_start").closest(".field").classList.add("invalid"); error = t("eStart"); }
      if (!e) { $("d_end").closest(".field").classList.add("invalid"); error = error || t("eEnd"); }
      if (s && e) {
        const a = parseDay(s), b = parseDay(e);
        if (a.getFullYear() !== b.getFullYear()) { $("d_end").closest(".field").classList.add("invalid"); error = t("eYear"); }
        else if (b < a) { $("d_end").closest(".field").classList.add("invalid"); error = t("eOrder"); }
        params[DI.year] = a.getFullYear();
        params[DI.start_month] = a.getMonth() + 1; params[DI.start_day] = a.getDate();
        params[DI.end_month] = b.getMonth() + 1; params[DI.end_day] = b.getDate();
      }
    }
    otherParams().forEach(p => {
      const inp = $(`p_${p.name}`); const v = Number(inp.value);
      if (inp.value === "" || Number.isNaN(v) || (p.min != null && v < p.min) || (p.max != null && v > p.max)) {
        inp.closest(".field").classList.add("invalid"); error = error || t("eRange", { label: L(p, "label"), min: p.min, max: p.max });
      }
      params[p.name] = v;
    });
    return { params, error };
  }
  function currentFormValues() {
    const v = {};
    if (DI && $("d_start") && $("d_start").value && $("d_end").value) {
      const a = parseDay($("d_start").value), b = parseDay($("d_end").value);
      Object.assign(v, { [DI.year]: a.getFullYear(), [DI.start_month]: a.getMonth() + 1, [DI.start_day]: a.getDate(),
                         [DI.end_month]: b.getMonth() + 1, [DI.end_day]: b.getDate() });
    }
    otherParams().forEach(p => { const i = $(`p_${p.name}`); if (i) v[p.name] = i.value; });
    return v;
  }

  function updatePeriodPreview() {
    if (!DI) { $("periodDays").hidden = true; return; }
    const s = $("d_start").value, e = $("d_end").value;
    if (!s || !e) { $("periodDays").textContent = ""; return; }
    const n = daysBetween(parseDay(s), parseDay(e)) + 1;
    $("periodDays").textContent = n > 0 ? t("calDays", { n }) : "";
    if (!activeId && stateMode === "idle") drawTimeline(parseDay(s), parseDay(e), null, "idle");
  }

  // ---------- console ----------
  function drawTimeline(start, end, atDate, kind) {
    $("endStart").innerHTML = start ? `${esc(dayFmt(start))}<small>${esc(t("startLbl"))}</small>` : "—";
    $("endEnd").innerHTML = end ? `${esc(dayFmt(end))}<small>${esc(t("endLbl"))}</small>` : "—";
    let pct = 0;
    if (kind === "done") pct = 100;
    else if (start && end && atDate) pct = Math.max(0, Math.min(100, (atDate - start) / ((end - start) + 86400000) * 100));
    $("fill").style.width = pct + "%";
    $("fill").classList.toggle("complete", kind === "done");
    let ticks = "";
    if (start && end && end > start) {
      const total = (end - start) + 86400000;
      const d = new Date(start.getFullYear(), start.getMonth() + 1, 1);
      const months = [];
      while (d <= end) { months.push(new Date(d)); d.setMonth(d.getMonth() + 1); }
      const every = Math.ceil(months.length / 6);
      months.forEach((m, i) => {
        if (i % every) return;
        const x = (m - start) / total * 100;
        if (x > 6 && x < 94) ticks += `<span class="tick" style="left:${x}%">${esc(m.toLocaleDateString(locale(), { month: "short" }))}</span>`;
      });
    }
    $("ticks").innerHTML = ticks;
  }

  function setState(tagCls, tag, msg, sub, spinning) {
    $("state").innerHTML = `${spinning ? '<span class="spin" aria-hidden="true"></span>' : ""}<span class="tag ${tagCls}">${esc(tag)}</span>` +
      `<span class="msg">${esc(msg)}${sub ? ` <span class="sub">${esc(sub)}</span>` : ""}</span>`;
  }
  function setIdle(msgKey = "idleMsg") {
    stateMode = "idle"; shownJob = null;
    setState("", t("idle"), t(msgKey), "", false);
    updatePeriodPreview();
  }

  function renderJob(job) {
    shownJob = job; stateMode = "job";
    const p = periodOf(job.parameters);
    switch (job.status) {
      case "submitted":
        setState("wait", t("sent"), t("sentMsg"), t("sentSub"), true);
        drawTimeline(p?.start, p?.end, null, "wait"); break;
      case "queued":
        setState("wait", t("queued"), job.queue_position > 1 ? t("queuePos", { n: job.queue_position }) : t("queueNext"), "", true);
        drawTimeline(p?.start, p?.end, null, "wait"); break;
      case "running": {
        if (job.mode === "fast") { setState("running", t("fast"), t("ffMsg"), t("ffSub"), true); drawTimeline(p?.start, p?.end, null, "run"); break; }
        if (job.progress == null) { setState("running", t("running"), t("starting"), "", true); drawTimeline(p?.start, p?.end, null, "run"); break; }
        const at = job.progress_date ? parseDay(job.progress_date) : null;
        const before = p && at && at < p.start;
        setState("running", t("running"), at ? t(before ? "warming" : "through", { date: dayFmt(at) }) : t("starting"),
          t("pctModel", { p: fmt(job.progress * 100, 0) }), true);
        drawTimeline(p?.start, p?.end, at, "run");
        if (job.id === activeId) showLive(job);
        break;
      }
      case "done":
        setState("done", t("finished"), t("finishedMsg", { when: when(job.finished_at) }), job.wall_seconds ? t("took", { s: fmt(job.wall_seconds, 0) }) : "", false);
        drawTimeline(p?.start, p?.end, null, "done"); break;
      default:
        setState(isStopped(job) ? "wait" : "error", isStopped(job) ? t("stopped") : t("failed"), errText(job.error), "", false);
        drawTimeline(p?.start, p?.end, null, "idle");
    }
    syncButtons();
  }

  function syncButtons() {
    const busy = !!activeId;
    $("btnRun").disabled = busy;
    $("btnFast").disabled = busy;
    $("btnStop").disabled = !busy;
  }

  // ---------- actions ----------
  async function submit(mode) {
    $("formError").hidden = true;
    const { params, error } = readForm();
    if (error) { $("formError").textContent = error; $("formError").hidden = false; return; }
    store("simLastParams", JSON.stringify(params));
    const who = $("f_who").value.trim(); if (who) store("simWho", who);
    $("btnRun").disabled = $("btnFast").disabled = true;
    try {
      const job = await T.submit({ parameters: params, run_length: null, mode, label: $("f_label").value.trim() || null, submitted_by: who || null });
      activeId = selectedId = job.id;
      renderJob(job);
      if (mode !== "fast") showLive(job);
      await refreshHistory();
      poll(job.id);
    } catch (err) {
      $("formError").textContent = err.message; $("formError").hidden = false;
      activeId = null; syncButtons();
    }
  }
  $("btnRun").addEventListener("click", () => submit("run"));
  $("btnFast").addEventListener("click", () => submit("fast"));
  $("form").addEventListener("submit", (e) => { e.preventDefault(); submit("run"); });

  $("btnStop").addEventListener("click", async () => {
    if (!activeId || !confirm(t("confirmStop"))) return;
    $("btnStop").disabled = true;
    setState("wait", t("stopping"), t("stoppingMsg"), t("stoppingSub"), true);
    try { await T.cancel(activeId); } catch (e) { $("btnStop").disabled = false; alert(e.message); }
  });

  $("btnReset").addEventListener("click", () => {
    store("simLastParams");
    buildForm(defaults());
    $("f_label").value = "";
    $("formError").hidden = true;
    if (!activeId) {
      selectedId = null;
      clearResults();
      setIdle("resetMsg");
      renderBars(); renderTable();
    }
  });

  function poll(id) {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => {
      try {
        const job = await T.getJob(id);
        if (ACTIVE.includes(job.status)) { renderJob(job); return poll(id); }
        activeId = null;
        renderJob(job);
        await refreshHistory();
        refreshSimStatus().catch(() => {});
        if (job.status === "done") showResult(job);
      } catch (err) {
        activeId = null;
        setState("error", t("failed"), err.message, "", false); syncButtons();
      }
    }, T.pollMs);
  }

  // ---------- results ----------
  function clearResults() {
    $("resultsTitle").textContent = t("results");
    $("resultsMeta").hidden = true;
    $("kpis").innerHTML = `<div class="empty">${esc(t("resultsEmpty"))}</div>`;
  }

  function spark(series, name) {
    const pts = (series || []).map(p => p.m?.[name]).filter(v => v != null && !Number.isNaN(Number(v))).map(Number);
    if (pts.length < 2) return "";
    const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
    const xy = pts.map((v, i) => [i / (pts.length - 1) * 100, 30 - (v - lo) / span * 26]);
    return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="${xy.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ")}"/></svg>`;
  }

  function kpiTiles(metrics, series, prev) {
    return CFG.metrics.map(m => {
      const v = metrics?.[m.name];
      let delta = "", cls = "";
      const pv = prev?.metrics?.[m.name];
      if (prev && v != null && pv != null && pv !== 0) {
        const pct = (v - pv) / Math.abs(pv) * 100;
        if (Math.abs(pct) < 0.05) delta = t("same");
        else { delta = t(pct > 0 ? "up" : "down", { p: fmt(Math.abs(pct), 1) }); cls = pct > 0 ? "up" : "down"; }
      }
      const unit = L(m, "unit");
      return `<div class="kpi"><div class="k">${esc(L(m, "label"))}</div>
        <div class="v">${fmt(v, m.decimals ?? 1)}${unit ? `<small>${esc(unit)}</small>` : ""}</div>
        ${spark(series, m.name)}
        <div class="d ${cls}">${esc(delta)}</div></div>`;
    }).join("");
  }

  function showResult(job) {
    selectedId = job.id;
    $("resultsTitle").textContent = runName(job);
    $("resultsMeta").hidden = false;
    $("resultsMeta").textContent = periodLabel(job.parameters) + (job.submitted_by ? t("runBy", { who: job.submitted_by }) : "");
    const prev = history.find(h => h.status === "done" && h.id !== job.id && new Date(h.submitted_at) < new Date(job.submitted_at));
    $("kpis").innerHTML = kpiTiles(job.metrics, job.series, prev);
    renderBars(); renderTable();
  }

  function showLive(job) {
    $("resultsTitle").innerHTML = `${esc(runName(job))}<span class="live-tag">${esc(t("liveTag"))}</span>`;
    $("resultsMeta").hidden = false;
    if (!job.live_metrics) {
      $("resultsMeta").textContent = periodLabel(job.parameters);
      $("kpis").innerHTML = `<div class="empty">${esc(t("liveWait"))}</div>`;
      return;
    }
    $("resultsMeta").textContent = t("liveMeta", { date: job.progress_date ? dayFmt(parseDay(job.progress_date)) : "…" });
    $("kpis").innerHTML = kpiTiles(job.live_metrics, job.series, null);
  }

  function renderBars() {
    const done = history.filter(h => h.status === "done").slice(0, 12);
    if (!done.length) { $("bars").innerHTML = `<div class="empty">${esc(t("compareEmpty"))}</div>`; return; }
    const m = CFG.metrics.find(x => x.name === $("metricSel").value) || CFG.metrics[0];
    const vals = done.map(h => Number(h.metrics?.[m.name] ?? 0));
    const max = Math.max(...vals.map(Math.abs), 1e-9);
    $("bars").innerHTML = done.map((h, i) => `
      <div class="bar-row ${h.id === selectedId ? "current" : ""}" title="${esc(runName(h))}">
        <div class="name">${esc(runName(h))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(1, Math.abs(vals[i]) / max * 100)}%"></div></div>
        <div class="val">${fmt(vals[i], m.decimals ?? 1)} ${esc(L(m, "unit"))}</div>
      </div>`).join("");
  }

  function renderTable() {
    if (!history.length) { $("hist").innerHTML = `<tbody><tr><td class="l empty" colspan="99">${esc(t("noRuns"))}</td></tr></tbody>`; return; }
    const head = (o) => L(o, "label") + (L(o, "unit") ? ` (${L(o, "unit")})` : "");
    const pcols = otherParams().map(p => ({ name: p.name, label: head(p), d: p.type === "integer" ? 0 : 1 }));
    const mcols = CFG.metrics.map(m => ({ name: m.name, label: head(m), d: m.decimals ?? 1 }));
    const pill = (h) => {
      const map = { submitted: ["wait", "pSent"], queued: ["wait", "pQueued"], running: ["running", "pRunning"], done: ["done", "pDone"],
                    error: isStopped(h) ? ["wait", "pStopped"] : ["error", "pFailed"] };
      const [c, k] = map[h.status] || ["error", "pFailed"];
      return `<span class="pill ${c}">${esc(t(k))}</span>`;
    };
    $("hist").innerHTML = `<thead><tr><th class="l">${esc(t("thScenario"))}</th><th class="l">${esc(t("thBy"))}</th><th class="l">${esc(t("thStatus"))}</th>${DI ? `<th class="l">${esc(t("thPeriod"))}</th>` : ""}` +
      pcols.map(c => `<th>${esc(c.label)}</th>`).join("") + mcols.map(c => `<th>${esc(c.label)}</th>`).join("") + "</tr></thead><tbody>" +
      history.map(h => `<tr class="${h.id === selectedId ? "selected" : ""}" data-id="${esc(h.id)}" tabindex="0">
        <td class="l">${esc(runName(h))}${h.mode === "fast" ? ` <span class="pill running">${esc(t("ffTag"))}</span>` : ""}</td>
        <td class="l">${esc(h.submitted_by || "")}</td><td class="l">${pill(h)}</td>
        ${DI ? `<td class="l">${esc(periodLabel(h.parameters))}</td>` : ""}
        ${pcols.map(c => `<td>${fmt(h.parameters?.[c.name], c.d, false)}</td>`).join("")}
        ${mcols.map(c => `<td>${fmt(h.metrics?.[c.name], c.d)}</td>`).join("")}</tr>`).join("") + "</tbody>";
    document.querySelectorAll("#hist tbody tr[data-id]").forEach(tr => {
      const open = () => {
        const j = history.find(h => h.id === tr.dataset.id); if (!j) return;
        if (j.status === "done") { showResult(j); if (!activeId) renderJob(j); }
        else { selectedId = j.id; if (!activeId) renderJob(j); renderTable(); }
      };
      tr.addEventListener("click", open);
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
    });
  }

  async function refreshHistory() {
    history = await T.history();
    renderBars(); renderTable();
  }

  let lastSim = undefined;
  async function refreshSimStatus(useCached = false) {
    const st = useCached ? lastSim : await T.simStatus();
    lastSim = st;
    const el = $("simStatus"); el.hidden = false;
    let cls = "off", text;
    if (!st) text = t("simNever");
    else {
      const age = (Date.now() - new Date(st.updated_at).getTime()) / 1000;
      const limit = Math.max(300, (st.heartbeat_seconds || 30) * 8);
      const q = (st.queue || []).length;
      if (st.online && st.running) { cls = "busy"; text = q ? t("simBusyQ", { n: q }) : t("simBusy"); }
      else if (st.online && age < limit) { cls = "on"; text = t("simOn", { ago: ago(st.updated_at) }); }
      else text = t("simOff", { ago: ago(st.updated_at) });
    }
    el.className = `sim-status ${cls}`;
    $("simStatusText").textContent = text;
  }

  function renderConfigText() {
    const title = L(CFG, "title"), sub = L(CFG, "subtitle");
    document.title = title;
    $("title").textContent = title;
    $("subtitle").textContent = sub;
    const cur = $("metricSel").value;
    $("metricSel").innerHTML = CFG.metrics.map(m => `<option value="${esc(m.name)}">${esc(L(m, "label"))}</option>`).join("");
    if (cur) $("metricSel").value = cur;
  }

  // ---------- language switch ----------
  function setLang(lang) {
    if (lang === LANG) return;
    LANG = lang; store("simLang", lang);
    applyStatic();
    if (!CFG) return;
    const vals = currentFormValues();
    renderConfigText();
    buildForm(vals);
    const sel = history.find(h => h.id === selectedId && h.status === "done");
    if (sel) showResult(sel); else { clearResults(); renderBars(); renderTable(); }
    if (stateMode === "job" && shownJob) renderJob(shownJob); else setIdle();
    refreshSimStatus(true).catch(() => {});
  }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  $("metricSel").addEventListener("change", renderBars);

  $("csvBtn").addEventListener("click", () => {
    const head = ["scenario", "submitted_by", "submitted_at", "status", "mode", ...(DI ? ["period"] : []),
      ...CFG.parameters.map(p => p.name), ...CFG.metrics.map(m => m.name)];
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = history.map(h => [runName(h), h.submitted_by, h.submitted_at, h.status, h.mode || "run", ...(DI ? [periodLabel(h.parameters)] : []),
      ...CFG.parameters.map(p => h.parameters?.[p.name]), ...CFG.metrics.map(m => h.metrics?.[m.name])].map(q).join(","));
    const blob = new Blob(["﻿" + [head.join(","), ...rows].join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "simulation_runs.csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  (async function init() {
    applyStatic();
    try {
      T = folderTransport(await connectFolder());
      CFG = await T.getConfig();
      DI = CFG.date_inputs || null;
      renderConfigText();
      $("mockBanner").hidden = !CFG.mock_mode;
      $("f_who").value = load("simWho") || "";
      let saved = null;
      try { saved = JSON.parse(load("simLastParams") || "null"); } catch (e) {}
      buildForm(saved || defaults());
      clearResults(); setIdle();
      $("app").hidden = false;
      await refreshSimStatus();
      await refreshHistory();
      const active = history.find(h => ACTIVE.includes(h.status));
      const lastDone = history.find(h => h.status === "done");
      if (lastDone) { showResult(lastDone); if (!active) renderJob(lastDone); }
      if (active) { activeId = selectedId = active.id; if (active.mode !== "fast") showLive(active); renderJob(active); poll(active.id); }
      syncButtons();
      setInterval(() => refreshSimStatus().catch(() => {}), 10000);
      setInterval(() => { if (!activeId) refreshHistory().catch(() => {}); }, 30000);
    } catch (err) {
      $("connectCard").hidden = true;
      $("subtitle").textContent = err.message;
    }
  })();
})();
</script>
</body>
</html>
