<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --steel: #e8ecf0;
    --panel: #ffffff;
    --ink: #17222e;
    --muted: #5b6876;
    --faint: #8a95a2;
    --line: #d5dce3;
    --console: #1c2a39;
    --console-2: #26384b;
    --console-ink: #e9eef3;
    --console-muted: #9fb0c1;
    --amber: #f2b01e;
    --amber-ink: #1c2a39;
    --blue: #2f6db0;
    --blue-soft: #e3ecf6;
    --ok: #2b8a57;
    --ok-soft: #e2f2e9;
    --err: #b8382f;
    --err-soft: #f8e5e3;
    --hold: #8a6d1d;
    --hold-soft: #f7efd8;
    --cjk: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    --display: "Barlow", "Segoe UI", system-ui, var(--cjk);
    --cond: "Barlow Semi Condensed", "Barlow", "Segoe UI", var(--cjk);
    --body: "Source Sans 3", "Segoe UI", system-ui, var(--cjk);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --steel: #121a22; --panel: #1a242f; --ink: #e6ebf0; --muted: #9aa7b4; --faint: #6f7d8b; --line: #2b3845;
      --console: #0e161e; --console-2: #1b2836; --blue: #6fa3dc; --blue-soft: #1d2e42;
      --ok: #5fc58d; --ok-soft: #173225; --err: #ee7d74; --err-soft: #3a1d1b; --hold: #e2c065; --hold-soft: #33290f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--steel); color: var(--ink); font: 16px/1.5 var(--body); }
  html[lang="zh-Hant"] body { line-height: 1.6; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

  /* ---------- header ---------- */
  header.top { padding: 28px 0 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header.top h1 { margin: 0; font: 700 30px/1.1 var(--display); letter-spacing: -0.01em; }
  header.top p { margin: 6px 0 0; color: var(--muted); }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sim-status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 12px; }
  .sim-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .sim-status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .sim-status.busy .dot { background: var(--amber); box-shadow: 0 0 0 3px var(--hold-soft); }
  .sim-status.off .dot { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
  .lang button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--console); color: #fff; font-weight: 600; }
  .demo { margin: 0 0 18px; background: var(--hold-soft); color: var(--hold); border-radius: 8px; padding: 10px 14px; font-size: 14px; }

  /* ---------- layout ---------- */
  main.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding-bottom: 48px; }
  main.page > * { min-width: 0; }
  .cat-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
  .cat-body { min-width: 0; display: grid; gap: 22px; }
  .cat-body > * { min-width: 0; }
  .cat-body > div { display: grid; gap: 22px; }
  .cat-nav { position: sticky; top: 16px; display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .cat-nav .grp { font: 600 12px var(--display); color: var(--faint); padding: 8px 10px 2px; letter-spacing: .02em; }
  .cat-nav button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 9px 12px; cursor: pointer; color: var(--ink); }
  .cat-nav button b { display: block; font: 600 15px var(--display); }
  .cat-nav button small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-nav button:hover { background: var(--steel); }
  .cat-nav button[aria-current="true"] { background: var(--console); color: #fff; }
  .cat-nav button[aria-current="true"] small { color: var(--console-muted); }
  .basic-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 28px; }
  .view-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .view-head h2 { margin: 0; }
  .run-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .run-inputs .ri { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .run-inputs .ri h3 { margin: 0 0 8px; font: 600 16px var(--display); }
  .run-inputs dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  .run-inputs dt { color: var(--muted); }
  .run-inputs dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .shift-count { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }
  .shift-count .lbl { font-weight: 600; }
  .shift-count .spacer { flex: 1; }
  .shift-count .check input { accent-color: var(--blue); }
  .shift-hint { margin: 0 0 12px; }
  .shift-grids { display: grid; gap: 18px; }
  .shift-grid h3 { margin: 0 0 8px; font: 600 16px var(--display); }
  .shift-grid.off h3::after { content: attr(data-off); margin-left: 10px; font: 500 13px var(--body); color: var(--faint); }
  table.shift td, table.shift th { padding: 4px 6px; }
  table.shift tbody tr { cursor: default; }
  table.shift tbody tr:hover td { background: transparent; }
  table.shift input { width: 64px; height: 32px; text-align: right; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-variant-numeric: tabular-nums; }
  table.shift input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .shift-grid.off table.shift input { background: var(--steel); color: var(--faint); border-style: dashed; }
  .hist-actions { display: flex; gap: 18px; align-items: center; }
  .link.danger { color: var(--err); }
  .err-box.warn.ok { background: var(--ok-soft); color: var(--ok); }
  .col { display: grid; gap: 22px; min-width: 0; }
  .col > * { min-width: 0; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  h2 { margin: 0 0 16px; font: 600 19px/1.2 var(--display); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; }

  /* ---------- scenario form ---------- */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .field label .opt { font-weight: 400; color: var(--faint); }
  .field input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--steel); font-size: 16px; }
  .field input:hover { border-color: var(--faint); }
  .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); background: var(--panel); }
  .field small { display: block; color: var(--muted); font-size: 13px; margin-top: 5px; }
  .field.invalid input { border-color: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }
  .period-days { font: 600 15px var(--cond); color: var(--muted); margin: -4px 0 18px; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 20px 0 18px; }
  .err-box { background: var(--err-soft); color: var(--err); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }

  /* ---------- console (signature) ---------- */
  .console { background: var(--console); color: var(--console-ink); border-radius: 14px; padding: 20px 22px 22px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .ctl { display: inline-flex; align-items: center; gap: 9px; height: 52px; padding: 0 20px; border-radius: 10px;
    border: 1px solid #3a4f66; background: var(--console-2); color: var(--console-ink); cursor: pointer;
    font: 600 16px var(--display); letter-spacing: 0.01em; transition: background .15s, transform .05s; }
  .ctl svg { width: 20px; height: 20px; flex: none; }
  .ctl:hover:not(:disabled) { background: #314760; }
  .ctl:active:not(:disabled) { transform: translateY(1px); }
  .ctl:disabled { opacity: .38; cursor: not-allowed; }
  .ctl.run { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); padding: 0 26px; }
  .ctl.run:hover:not(:disabled) { background: #ffc23d; }
  .ctl.stop:not(:disabled) { color: #ffb4ad; border-color: #6b3a3a; }
  .ctl.stop:hover:not(:disabled) { background: #4a2c2e; }
  .controls .spacer { flex: 1; }
  .ctl:focus-visible { outline-color: var(--amber); }

  .state { display: flex; align-items: center; gap: 12px; margin: 22px 0 14px; min-height: 28px; }
  .state .tag { font: 600 13px var(--display); letter-spacing: .02em; padding: 4px 11px; border-radius: 6px; background: var(--console-2); color: var(--console-muted); white-space: nowrap; }
  .state .tag.running { background: var(--amber); color: var(--amber-ink); }
  .state .tag.done { background: #23553d; color: #c6f0d7; }
  .state .tag.error { background: #5a2a28; color: #ffc9c3; }
  .state .tag.wait { background: #3a4c60; color: #dbe6f1; }
  .state .msg { color: var(--console-ink); font-size: 15px; }
  .state .msg .sub { color: var(--console-muted); }

  .timeline { position: relative; padding-top: 4px; }
  .track { position: relative; height: 10px; border-radius: 5px; background: var(--console-2); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #3d7fc4, #6fb0ef); border-radius: 5px; transition: width .8s ease; }
  .fill.complete { background: #3fa46e; }
  .ticks { position: relative; height: 22px; margin-top: 6px; }
  .tick { position: absolute; top: 0; transform: translateX(-50%); font: 500 12px var(--cond); color: var(--console-muted); white-space: nowrap; }
  .tick::before { content: ""; position: absolute; left: 50%; top: -12px; width: 1px; height: 6px; background: #4a6079; }
  .ends { display: flex; justify-content: space-between; font: 600 15px var(--display); margin-bottom: 8px; }
  .ends span:last-child { text-align: right; }
  .ends small { display: block; font: 400 12px var(--body); color: var(--console-muted); }
  @media (prefers-reduced-motion: reduce) { .fill, .bar-fill { transition: none; } .spin { animation: none !important; } }
  .spin { width: 16px; height: 16px; border: 2px solid #4a6079; border-top-color: var(--amber); border-radius: 50%; animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- results ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
  .kpi { padding: 16px 18px 4px 0; }
  .kpi .k { color: var(--muted); font-size: 14px; }
  .kpi .v { font: 600 40px/1.05 var(--cond); letter-spacing: -0.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font: 500 15px var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .kpi .d { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 18px; }
  .kpi .d.up { color: var(--ok); } .kpi .d.down { color: var(--err); }
  .results-meta { color: var(--muted); font-size: 14px; margin: -8px 0 14px; }
  .live-tag { display: inline-block; vertical-align: middle; margin-left: 10px; font: 600 12px var(--display); letter-spacing: .02em;
    color: var(--amber-ink); background: var(--amber); padding: 3px 9px; border-radius: 5px; }
  .live-tag::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--amber-ink); margin-right: 6px; vertical-align: 1px; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .live-tag::before { animation: none; } }
  .spark { display: block; width: 100%; max-width: 220px; height: 34px; margin-top: 8px; overflow: visible; }
  .spark polyline { fill: none; stroke: var(--blue); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .empty { color: var(--muted); padding: 18px 0 6px; }

  select { height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--steel); }
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 200px) minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 14px; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .bar-track { background: var(--steel); border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; background: #a9c4e2; border-radius: 4px; transition: width .4s; }
  .bar-row.current .bar-fill { background: var(--blue); }
  .bar-row.current .name { color: var(--ink); font-weight: 600; }
  .bar-row .val { white-space: nowrap; text-align: right; font: 600 15px var(--cond); font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; margin: 0 -22px; padding: 0 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  th.l, td.l { text-align: left; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--steel); }
  tr.selected td { background: var(--blue-soft); }
  .pill { font: 600 12px var(--display); padding: 3px 9px; border-radius: 5px; letter-spacing: .02em; }
  .pill.done { background: var(--ok-soft); color: var(--ok); }
  .pill.error { background: var(--err-soft); color: var(--err); }
  .pill.wait { background: var(--hold-soft); color: var(--hold); }
  .pill.running { background: var(--blue-soft); color: var(--blue); }
  .link { border: 0; background: none; color: var(--blue); padding: 0; cursor: pointer; font-weight: 600; font-size: 14px; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin: 0 0 22px; }
  .tabs button { border: 0; background: none; cursor: pointer; padding: 10px 18px 12px; font: 600 17px var(--display);
    color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }
  .tabs .count { font: 600 12px var(--cond); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 4px; }
  .tabs .count:empty { display: none; }
  .panel-head .hist-hint { margin: 6px 0 0; }
  td.who b { font-weight: 600; }
  td.who small, td.dev small { display: block; color: var(--muted); font-size: 12px; }
  .tabs button .badge { display: inline-block; min-width: 8px; height: 8px; border-radius: 50%; background: var(--amber); margin-left: 8px; vertical-align: 2px; }

  /* ---------- output page ---------- */
  main.out { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding-bottom: 48px; }
  main.out > * { min-width: 0; }
  #detailPanel .table-wrap { max-height: 560px; overflow: auto; }
  table.daily thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; box-shadow: inset 0 -1px 0 var(--line); }
  .out-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 22px; align-items: start; }
  .out-grid > * { min-width: 0; }
  .out-head .results-meta { margin: 10px 0 0; }
  #totals .bar-row { grid-template-columns: minmax(48px, 80px) minmax(0, 1fr) auto; }
  .run-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .run-pick label { font: 600 15px var(--display); }
  .run-pick select { max-width: 100%; min-width: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--steel); }
  .seg button { border: 0; background: none; padding: 6px 16px; border-radius: 7px; cursor: pointer; font: 600 15px var(--display); color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(23,34,46,.12); }
  /* product switch (Bianca / Strata): separate pills, the chosen one filled dark — reads as "which product", not "which view" */
  .seg.prod { border: 0; background: none; padding: 0; gap: 8px; }
  .seg.prod button { border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 7px 18px 7px 14px;
    display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .seg.prod button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--faint); }
  .seg.prod button:hover { border-color: var(--faint); }
  .seg.prod button[aria-pressed="true"] { background: var(--console); border-color: var(--console); color: #fff; box-shadow: none; }
  @media (prefers-color-scheme: dark) { .seg.prod button[aria-pressed="true"] { background: var(--console-2); border-color: var(--amber); } }
  .seg.prod button[aria-pressed="true"]::before { border-color: var(--amber); background: var(--amber); }
  .seg.prod button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  /* time unit switch stays a compact light segmented control */
  #granSeg button { padding: 5px 14px; font-size: 14px; }
  .hint { color: var(--muted); font-size: 13px; margin: -10px 0 14px; }
  .empty-panel { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
  .chips button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart .grid line { stroke: var(--line); stroke-width: 1; }
  .chart .axis text { fill: var(--muted); font: 500 12px var(--cond); }
  .chart .bar { fill: var(--blue); }
  .chart .bar.hot { fill: #1f4f86; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .zero { fill: var(--line); }
  /* OEE */
  .oee-def { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 24px; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
  .oee-def dt { font-weight: 700; font-size: 13px; }
  .oee-def dd { margin: 2px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .tile .o2 { display: block; font: 600 30px/1.1 var(--cond); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .o2 small { font: 600 13px var(--display); color: var(--muted); }
  .tile .o1 { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .legend .lg-o1, .legend .lg-o2 { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin: 0 6px 0 14px; vertical-align: -1px; }
  .legend .lg-o1 { background: var(--st-setup); } .legend .lg-o2 { background: var(--blue); }
  .chart .b1 { fill: var(--st-setup); } .chart .b2 { fill: var(--blue); } .chart .b1.hot, .chart .b2.hot { filter: brightness(.85); }
  .chart .ref { stroke: var(--faint); stroke-dasharray: 2 4; }
  table.oee th.grp { text-align: center; border-bottom: 1px solid var(--line); }
  table.oee td.rest { color: var(--faint); }
  @media (max-width: 640px) { .oee-def { grid-template-columns: 1fr; } }
  /* equipment utilization */
  :root { --st-proc: #2f6db0; --st-setup: #2a9d8f; --st-op: #c8463c; --st-tr: #7d5bbf; --st-block: #c98516;
          --st-down: #a0582c; --st-idle: #c3cbd4; --st-other: #7c8a99; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --st-proc: #5b95d6; --st-setup: #1aa591; --st-op: #e65f70; --st-tr: #9b7fd6; --st-block: #c28418;
    --st-down: #c47a48; --st-idle: #46535f; --st-other: #8090a0; } }
  :root[data-theme="dark"] { --st-proc: #5b95d6; --st-setup: #1aa591; --st-op: #e65f70; --st-tr: #9b7fd6; --st-block: #c28418;
    --st-down: #c47a48; --st-idle: #46535f; --st-other: #8090a0; }
  .util-segs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .util-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
  .util-stats { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 0; }
  .util-stats dt { color: var(--muted); font-size: 13px; }
  .util-stats dd { margin: 0; font: 600 26px/1.15 var(--cond); font-variant-numeric: tabular-nums; }
  .util-stats dd small { display: block; font: 500 13px var(--display); color: var(--muted); max-width: 260px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .util-sort { height: 36px; font-size: 14px; font-weight: 500; }
  .util-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 18px 0 6px; font-size: 13px; color: var(--muted); }
  .util-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .util-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .util-list { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 64px; align-items: center; gap: 6px 14px; margin-top: 14px; }
  .util-list .head { font-size: 12px; color: var(--faint); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .util-list .head.r, .util-list .pct { text-align: right; }
  .util-list .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .util-list .pct { font: 600 16px var(--cond); font-variant-numeric: tabular-nums; }
  .util-list .pct.na { color: var(--faint); font-weight: 500; }
  .ubar { display: flex; gap: 2px; height: 22px; border-radius: 4px; overflow: hidden; background: var(--panel); }
  .ubar.empty { background: var(--steel); }
  .ubar span { display: block; height: 100%; min-width: 2px; cursor: default; }
  .ubar span:hover { filter: brightness(1.12); }
  .util-missing { margin: 14px 0 0; font-size: 13px; color: var(--hold); }
  @media (max-width: 640px) {
    .util-list { grid-template-columns: minmax(0, 1fr) 56px; }
    .util-list .nm { grid-column: 1 / -1; margin-top: 6px; }
    .util-list .head.nmh { display: none; }
  }
  .tip { position: fixed; z-index: 10; pointer-events: none; background: var(--console); color: var(--console-ink); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; }
  .tip b { font: 600 18px var(--cond); }
  table.daily td.k, table.daily th.k { text-align: left; }
  table.daily td.off { color: var(--faint); }
  table.daily tbody tr { cursor: default; }
  .goto { margin-left: 12px; border: 1px solid #4a6079; background: none; color: var(--console-ink); border-radius: 7px; padding: 4px 12px; cursor: pointer; font: 600 14px var(--display); }
  .goto:hover { background: var(--console-2); }
  @media (max-width: 900px) { .out-grid { grid-template-columns: 1fr; } }

  /* ---------- daily plan ---------- */
  .plan-controls { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
  .plan-controls .spacer { flex: 1; }
  .plan-target { margin: 0; width: 180px; }
  .check { display: inline-flex; align-items: center; gap: 8px; height: 44px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--blue); }
  .plan-fill { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 12px 14px; margin: 0 0 16px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--steel); }
  .plan-fill .fill-lbl { font-weight: 700; font-size: 14px; margin-right: 4px; }
  .plan-fill .fill-or { color: var(--muted); font-size: 14px; }
  .plan-fill .fill-each { display: inline-flex; align-items: center; gap: 8px; }
  .plan-fill .fill-each label { font-size: 14px; color: var(--muted); }
  .plan-fill input[type=number] { width: 96px; height: 36px; text-align: right; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); font-variant-numeric: tabular-nums; }
  .plan-fill input[type=number]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .fill-btn { height: 36px; padding: 0 14px; border: 1px solid var(--blue); border-radius: 6px; background: var(--panel);
    color: var(--blue); font-weight: 600; font-size: 14px; cursor: pointer; }
  .fill-btn:hover { background: var(--blue-soft); }
  .fill-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .plan-fill .fill-only { height: 36px; font-size: 14px; font-weight: 500; margin-left: auto; }
  .plan-fill .fill-msg { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
  .plan-fill .fill-msg:empty { display: none; }
  .plan-stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 10px; }
  .plan-stats div { min-width: 0; }
  .plan-stats dt { color: var(--muted); font-size: 13px; }
  .plan-stats dd { margin: 0; font: 600 24px/1.15 var(--cond); font-variant-numeric: tabular-nums; }
  .plan-stats dd.neg { color: var(--err); }
  .plan-hol { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .plan-hint { margin: 0 0 10px; }
  .err-box.warn { background: var(--hold-soft); color: var(--hold); margin: 0 0 12px; }
  .plan-wrap { max-height: 520px; overflow: auto; }
  table.plan thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; box-shadow: inset 0 -1px 0 var(--line); }
  table.plan tbody tr { cursor: default; }
  table.plan tbody tr:hover td { background: transparent; }
  table.plan td { padding: 4px 12px; }
  table.plan td.in { width: 140px; }
  table.plan input { width: 120px; height: 34px; text-align: right; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); font-variant-numeric: tabular-nums; }
  table.plan input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  table.plan input.filled { border-color: #9db8d8; background: var(--blue-soft); }
  table.plan tr.hol td { color: var(--faint); background: var(--steel); }
  table.plan tr.hol input { background: transparent; border-style: dashed; color: var(--faint); }
  table.plan td.sug { font-weight: 600; }
  table.plan td.sug.neg { color: var(--err); }
  table.plan label.rest { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; flex-wrap: wrap; }
  table.plan label.rest input { width: 18px; height: 18px; margin: 0; padding: 0; border: 0; accent-color: var(--hold); }
  table.plan label.rest span { color: var(--muted); }
  table.plan tr.hol label.rest span { color: var(--ink); }
  table.plan label.rest small, table.plan tr.hol label.rest small { flex-basis: 100%; padding-left: 26px; color: var(--hold); font-size: 12px; font-weight: 600; }
  table.plan td.hcell b { color: var(--hold); font-weight: 700; margin-right: 6px; }
  table.plan td.hcell small { color: var(--faint); }

  /* ---------- connect ---------- */
  .connect { max-width: 560px; margin: 8px auto 60px; }
  .connect p, .connect ol { color: var(--muted); }
  .connect ol { padding-left: 20px; margin: 0 0 20px; }
  .connect li { margin-bottom: 4px; }
  .connect code { background: var(--steel); padding: 1px 6px; border-radius: 4px; color: var(--ink); }
  .btn-primary { height: 48px; width: 100%; border: 0; border-radius: 10px; background: var(--console); color: #fff; font: 600 16px var(--display); cursor: pointer; }

  @media (max-width: 900px) {
    .cat-layout { grid-template-columns: 1fr; }
    .cat-nav { position: static; display: flex; overflow-x: auto; padding: 6px; }
    .cat-nav .grp { display: none; }
    .cat-nav button { width: auto; flex: none; }
    .basic-grid { grid-template-columns: 1fr; }
    .wrap { padding: 0 16px; }
    .ctl { height: 48px; padding: 0 16px; }
    .ctl.run { padding: 0 20px; }
    .controls .spacer { display: none; }
  }
  @media (max-width: 520px) {
    .ctl span { display: none; }
    .ctl, .ctl.run { padding: 0 16px; flex: 1; justify-content: center; }
    .kpi .v { font-size: 34px; }
    .bar-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
    .bar-row .name { grid-column: 1 / -1; }
  }

  /* ================= visual refinement ================= */
  :root { --steel: #eef1f5; --line: #e1e6ed; --bar: #142030; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.05); }
  @media (prefers-color-scheme: dark) { :root { --steel: #121a22; --line: #2b3845; --bar: #0b121a; --shadow: 0 1px 2px rgba(0,0,0,.4); } }
  section.panel { border: 1px solid rgba(16,24,40,.06); box-shadow: var(--shadow); border-radius: 14px; padding: 24px; }
  h2 { font-size: 18px; letter-spacing: -0.005em; }

  /* app bar: header + tabs on one dark band, full bleed */
  header.top, nav.tabs { background: var(--bar); box-shadow: 0 0 0 100vmax var(--bar); clip-path: inset(0 -100vmax); }
  header.top { padding: 26px 0 16px; }
  header.top h1 { color: #fff; font-size: 26px; }
  header.top p { color: #93a4b6; }
  nav.tabs { border-bottom: 0; margin: 0 0 30px; gap: 4px; }
  nav.tabs button { color: #93a4b6; padding: 12px 18px 14px; border-bottom-width: 3px; }
  nav.tabs button:hover { color: #fff; }
  nav.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--amber); }
  .tabs .count { background: rgba(255,255,255,.1); border-color: transparent; color: #dbe6f1; }
  .sim-status { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); color: #c9d4df; }
  .sim-status.on .dot { box-shadow: 0 0 0 3px rgba(43,138,87,.25); }
  .lang { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }
  .lang button { color: #c9d4df; }
  .lang button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); }
  .demo { margin-top: -10px; }

  /* category menu: quiet list with an amber marker */
  .cat-nav { background: transparent; border: 0; box-shadow: none; padding: 0; gap: 2px; }
  .cat-nav .grp { padding: 0 14px 6px; }
  .cat-nav button { border-left: 3px solid transparent; border-radius: 0 10px 10px 0; padding: 11px 14px; }
  .cat-nav button:hover { background: rgba(20,32,48,.05); }
  .cat-nav button[aria-current="true"] { background: var(--panel); color: var(--ink); border-left-color: var(--amber); box-shadow: var(--shadow); }
  .cat-nav button[aria-current="true"] small { color: var(--muted); }

  /* metric cards */
  .kpis { border-top: 0; gap: 12px; }
  .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .kpi .v { font-size: 38px; }
  .run-inputs .ri { border-color: var(--line); border-radius: 12px; }

  /* station tiles */
  .hint.tight { margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; text-align: left; min-width: 0;
    border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px 16px 12px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s; }
  .tile:hover { border-color: #b7c4d4; }
  .tile[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .tile .nm { font: 600 14px var(--display); color: var(--muted); }
  .tile[aria-pressed="true"] .nm { color: var(--blue); }
  .tile .tv { font: 600 30px/1.1 var(--cond); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .av { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile .spark { width: 100%; max-width: none; height: 28px; margin-top: 8px; }
  .tile .spark polyline { stroke: #9db8d8; }
  .tile[aria-pressed="true"] .spark polyline { stroke: var(--blue); }
  .out-grid { grid-template-columns: minmax(0, 1fr); }

  /* chart */
  .legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .legend .lg-bar { width: 12px; height: 12px; border-radius: 3px; background: var(--blue); }
  .legend .lg-avg { width: 18px; height: 0; border-top: 2px dashed var(--amber); margin-left: 12px; }
  .chart .avg { stroke: var(--amber); stroke-width: 2; stroke-dasharray: 6 5; }
  .chart .grid line { stroke: var(--line); }

  /* tables */
  table.daily th, table.plan th { font-weight: 600; }
  table.daily td { padding: 9px 12px; }
  .cat-body > div > * { min-width: 0; }

  /* metrics header: one compact bar instead of two empty panels */
  section.panel.out-head { display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; padding: 16px 22px; }
  .out-head .results-meta { margin: 0; }
  .run-pick select { height: 40px; font-weight: 600; }
  section.panel.view-head { background: transparent; border: 0; box-shadow: none; padding: 4px 0 0; }
  .view-head h2 { font-size: 22px; }

  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    nav.tabs { overflow-x: auto; }
    nav.tabs button { padding: 10px 12px 12px; font-size: 15px; white-space: nowrap; flex: none; }
    .tile .tv { font-size: 24px; }
    section.panel { padding: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Production Simulator</h1>
      <p id="subtitle" data-i18n="loading">Loading…</p>
    </div>
    <div class="top-right">
      <div id="simStatus" class="sim-status" hidden><span class="dot"></span><span id="simStatusText"></span></div>
      <div class="lang" role="group" aria-label="Language / 語言">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
      </div>
    </div>
  </header>
  <div class="demo" id="mockBanner" data-i18n="demo" hidden></div>

  <section class="panel connect" id="connectCard" hidden>
    <h2 data-i18n="connectTitle"></h2>
    <p data-i18n="connectBody"></p>
    <ol>
      <li data-i18n="connectStep1"></li>
      <li data-i18n-html="connectStep2"></li>
      <li data-i18n="connectStep3"></li>
    </ol>
    <button class="btn-primary" id="connectBtn" type="button" data-i18n="chooseFolder"></button>
    <div id="connectError" class="err-box" hidden></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" id="tabInput" data-tab="input" aria-controls="app" data-i18n="tabInput"></button>
    <button type="button" role="tab" id="tabOutput" data-tab="output" aria-controls="pageOutput" data-i18n="tabOutput"></button>
    <button type="button" role="tab" id="tabHistory" data-tab="history" aria-controls="pageHistory"><span data-i18n="tabHistory"></span> <span class="count" id="histCount"></span></button>
  </nav>

  <main class="page" id="app" role="tabpanel" aria-labelledby="tabInput" hidden>
    <section class="console" data-i18n-aria="controlsAria">
      <div class="controls">
        <button type="button" class="ctl" id="btnReset" data-i18n-title="resetTip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span data-i18n="reset"></span></button>
        <button type="button" class="ctl run" id="btnRun" data-i18n-title="runTip">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
          <span data-i18n="run"></span></button>
        <button type="button" class="ctl" id="btnFast" data-i18n-title="fastTip">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 5.2v13.6a.8.8 0 0 0 1.25.66L12 13.6v5.2a.8.8 0 0 0 1.25.66l9.4-6.8a.8.8 0 0 0 0-1.32l-9.4-6.8A.8.8 0 0 0 12 5.2v5.2L3.75 4.54A.8.8 0 0 0 2.5 5.2z"/></svg>
          <span data-i18n="fast"></span></button>
        <button type="button" class="ctl" id="btnPause" data-i18n-title="pauseTip" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>
          <span data-i18n="pause"></span></button>
        <div class="spacer"></div>
        <button type="button" class="ctl stop" id="btnStop" data-i18n-title="stopTip" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          <span data-i18n="stop"></span></button>
      </div>

      <div class="state" id="state" aria-live="polite"></div>

      <div class="timeline">
        <div class="ends"><span id="endStart">—</span><span id="endEnd">—</span></div>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="ticks" id="ticks"></div>
      </div>
    </section>

    <section class="panel live" id="livePanel" hidden>
      <h2 id="resultsTitle"></h2>
      <div class="results-meta" id="resultsMeta" hidden></div>
      <div id="kpis" class="kpis"></div>
    </section>

    <div class="cat-layout">
      <nav class="cat-nav" id="inNav" data-i18n-aria="inputCats"></nav>
      <div class="cat-body">
        <section class="panel" data-cat="basic">
          <div class="panel-head">
            <h2 data-i18n="catBasic"></h2>
            <button type="button" class="link" id="btnDefaults" data-i18n="restoreDefaults"></button>
          </div>
          <form id="form" novalidate>
            <div class="basic-grid">
              <div>
                <div id="fields"></div>
                <div class="period-days" id="periodDays"></div>
              </div>
              <div>
                <div class="field">
                  <label for="f_label"><span data-i18n="scenarioName"></span> <span class="opt" data-i18n="optional"></span></label>
                  <input id="f_label" maxlength="60" data-i18n-placeholder="scenarioPh">
                </div>
                <div class="field">
                  <label for="f_who"><span data-i18n="yourName"></span></label>
                  <input id="f_who" maxlength="60" autocomplete="name" required>
                  <small data-i18n="nameHelp"></small>
                </div>
              </div>
            </div>
            <div id="formError" class="err-box" hidden></div>
          </form>
        </section>

        <section class="panel" data-cat="plan" id="planPanel">
          <div class="panel-head">
            <h2 data-i18n="planTitle"></h2>
            <div class="seg prod" id="planSeg" role="group" data-i18n-aria="product"></div>
          </div>
          <p class="empty" id="planNoPeriod" data-i18n="needPeriod" hidden></p>
          <div id="planBody">
          <div class="plan-controls">
            <div class="field plan-target">
              <label for="planTarget" data-i18n="target"></label>
              <input id="planTarget" type="number" inputmode="numeric" min="0" step="1">
            </div>
            <label class="check"><input type="checkbox" id="planSat"> <span data-i18n="satOff"></span></label>
            <label class="check"><input type="checkbox" id="planSun"> <span data-i18n="sunOff"></span></label>
            <div class="spacer"></div>
            <button type="button" class="link" id="planClear" data-i18n="planClear"></button>
          </div>
          <div class="plan-fill" role="group" aria-labelledby="fillLbl">
            <span class="fill-lbl" id="fillLbl" data-i18n="fillTitle"></span>
            <button type="button" class="fill-btn" id="fillSpread" data-i18n="fillSpread"></button>
            <span class="fill-or" data-i18n="fillOr"></span>
            <span class="fill-each">
              <label for="fillEach" data-i18n="fillEachLbl"></label>
              <input id="fillEach" type="number" inputmode="numeric" min="0" step="1">
              <button type="button" class="fill-btn" id="fillEachBtn" data-i18n="fillEachBtn"></button>
            </span>
            <label class="check fill-only"><input type="checkbox" id="fillOnlyEmpty"> <span data-i18n="fillOnlyEmpty"></span></label>
            <p class="fill-msg" id="fillMsg" role="status" aria-live="polite"></p>
          </div>
          <dl class="plan-stats" id="planStats"></dl>
          <p class="plan-hol" id="planHolidays"></p>
          <div class="err-box warn" id="planWarn" hidden></div>
          <p class="hint plan-hint" data-i18n="planHint"></p>
          <div class="table-wrap plan-wrap"><table id="planTable" class="plan"></table></div>
          </div>
        </section>

        <section class="panel" data-cat="shift" id="shiftPanel">
          <div class="panel-head">
            <h2 data-i18n="shiftTitle"></h2>
            <div class="seg prod" id="shiftSeg" role="group" data-i18n-aria="product"></div>
          </div>
          <div class="shift-count" role="radiogroup" data-i18n-aria="shiftCount">
            <span class="lbl" data-i18n="shiftCount"></span>
            <label class="check"><input type="radio" name="shiftCount" value="1"> <span data-i18n="oneShift"></span></label>
            <label class="check"><input type="radio" name="shiftCount" value="2"> <span data-i18n="twoShifts"></span></label>
            <div class="spacer"></div>
            <button type="button" class="link" id="shiftCopy" data-i18n="shiftCopy"></button>
            <button type="button" class="link" id="shiftDefault" data-i18n="shiftDefault"></button>
          </div>
          <p class="hint shift-hint" data-i18n="shiftHint"></p>
          <div class="shift-grids" id="shiftGrids"></div>
        </section>
      </div>
    </div>
  </main>

  <main class="page" id="pageOutput" role="tabpanel" aria-labelledby="tabOutput" hidden>
    <section class="panel out-head">
      <div class="run-pick">
        <label for="runSel" data-i18n="outRun"></label>
        <select id="runSel"></select>
      </div>
      <div class="results-meta" id="outMeta"></div>
    </section>

  const ERR_ZH = [
    [/^Cancelled before it started$/, "開始前已取消"],
    [/^Cancelled$/, "已取消"],
    [/^Stopped on the simulator PC/, "模擬電腦在跑完前停止了，請重新執行。"],

    [/stopped part-way through writing results/, "FlexSim 寫結果寫到一半就停止了。"],

  ];

  let LANG = load("simLang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
  function t(key, vars) {
    let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
    return s;
  }
  const L = (obj, field) => (LANG === "zh" && obj?.[field + "_zh"]) || obj?.[field] || "";
  function errText(msg) {
    if (!msg) return t("failedMsg");
    if (LANG !== "zh") return msg;
    for (const [re, zh] of ERR_ZH) if (re.test(msg)) return msg.replace(re, zh);
    return msg;
  }
  const locale = () => LANG === "zh" ? "zh-TW" : "en-US";

  function applyStatic() {
    document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });

  // 共用資料夾存取（OneDrive 中轉）
  // =====================================================================
  const IDB_NAME = "flexsim-web", IDB_STORE = "handles";
  function idb(mode, fn) {
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(IDB_NAME, 1); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => {
        try {
          const tx = req.result.transaction(IDB_STORE, mode);
          const r = fn(tx.objectStore(IDB_STORE));
          tx.oncomplete = () => resolve(r && r.result);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        } catch (e) { reject(e); }
      };
    });
  }
  const saveHandle = (h) => idb("readwrite", s => s.put(h, "share")).catch(() => {});
  const loadHandle = () => idb("readonly", s => s.get("share")).catch(() => null);

  function folderTransport(root) {
    let lastStatus = null;

    async function readJson(dir, name) {
      try {
        const d = dir ? await root.getDirectoryHandle(dir) : root;
        const fh = await d.getFileHandle(name);
        const text = await (await fh.getFile()).text();
        return JSON.parse(text);
      } catch (e) { return null; }  // 不存在、或 OneDrive 還在同步
    }
    async function writeJson(dir, name, data) {
      const d = await root.getDirectoryHandle(dir, { create: true });
      const fh = await d.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(data, null, 2));
      await w.close();
    }
    async function listIds(dir) {
      const ids = [];
      try {
        const d = await root.getDirectoryHandle(dir);
        for await (const [name, h] of d.entries()) {
          if (h.kind === "file" && /^[A-Za-z0-9_-]{1,64}\.json$/.test(name)) ids.push(name.slice(0, -5));
        }
      } catch (e) {}
      return ids;
    }
    function newId() {
      const t = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
      const r = Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, "0")).join("");
      return `${t}-${r}`;
    }
    async function status() { lastStatus = await readJson(null, "status.json"); return lastStatus; }
    async function merge(id, jobFile) {
      const res = await readJson("results", `${id}.json`);
      if (res) return res;
      const job = jobFile || await readJson("jobs", `${id}.json`);
      if (!job) return null;
      const q = lastStatus?.queue || [];
      const pos = q.indexOf(id);
      return { ...job, id, status: pos >= 0 ? "queued" : "submitted", queue_position: pos >= 0 ? pos + 1 : null };
    }
    return {
      kind: "folder",
      pollMs: 3000,
      async getConfig() {
        const c = await readJson(null, "config.json");
        if (!c) throw new Error(t("errNoConfig"));
        return c;
      },
      async submit(job) {
        const id = newId();
        const data = { ...job, id, submitted_at: new Date().toISOString() };
        await writeJson("jobs", `${id}.json`, data);
        return { ...data, status: "submitted" };
      },
      async getJob(id) { await status(); return (await merge(id)) || { id, status: "submitted" }; },
      async cancel(id) { await writeJson("cancel", `${id}.json`, { id, cancelled_at: new Date().toISOString() }); },
      async admin(id, data) { await writeJson("admin", `${id}.json`, data); },
      async adminResult(id) { return await readJson("admin", `${id}.result.json`); },
      newId,
      async control(id, action) { await writeJson("control", `${id}.json`, { id, action, at: new Date().toISOString() }); },
      async history() {
        await status();
        const ids = (await listIds("jobs")).sort().reverse().slice(0, 50);
        const out = [];
        for (const id of ids) { const j = await merge(id); if (j) out.push(j); }
        return out;
      },
      simStatus: status,
    };
  }

  async function connectFolder() {
    const unsupported = !("showDirectoryPicker" in window);
    $("connectCard").hidden = false;
    $("subtitle").textContent = "";
    if (unsupported) {
      $("connectBtn").hidden = true;
      $("connectError").textContent = t("errBrowser");
      $("connectError").hidden = false;
      return new Promise(() => {});
    }
    const saved = await loadHandle();
    let reconnecting = false;
    if (saved) {
      try {
        if (await saved.queryPermission({ mode: "readwrite" }) === "granted") { $("connectCard").hidden = true; return saved; }
        $("connectBtn").textContent = t("reconnect", { name: saved.name }); reconnecting = true;
      } catch (e) {}
    }
    return new Promise((resolve) => {
      $("connectBtn").onclick = async () => {
        $("connectError").hidden = true;
        try {
          let h = null;
          if (saved && reconnecting) {
            if (await saved.requestPermission({ mode: "readwrite" }) === "granted") h = saved;
          }
          if (!h) h = await window.showDirectoryPicker({ id: "flexsim-share", mode: "readwrite" });
          try { await h.getFileHandle("config.json"); }
          catch (e) { throw new Error(t("errWrongFolder", { name: h.name })); }
          await saveHandle(h);
          $("connectCard").hidden = true;
          resolve(h);
        } catch (e) {
          if (e.name === "AbortError") return;
          $("connectBtn").textContent = t("chooseFolder"); reconnecting = false;
          $("connectError").textContent = e.message;
          $("connectError").hidden = false;
        }
      };
    });
  }
