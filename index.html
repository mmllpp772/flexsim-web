  // ---------- formatting ----------
  const pad = (n) => String(n).padStart(2, "0");
  function fmt(v, decimals = 1, group = true) {
    if (v === null || v === undefined || Number.isNaN(Number(v))) return "—";
    return Number(v).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals, useGrouping: group });
  }
  const parseDay = (s) => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const isoDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayFmt = (d, year = true) => d.toLocaleDateString(locale(), year ? { month: "short", day: "numeric", year: "numeric" } : { month: "short", day: "numeric" });
  const when = (iso) => iso ? new Date(iso).toLocaleString(locale(), { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return t("sAgo", { n: Math.round(s) });
    if (s < 5400) return t("mAgo", { n: Math.round(s / 60) });
    if (s < 172800) return t("hAgo", { n: Math.round(s / 3600) });
    return t("dAgo", { n: Math.round(s / 86400) });
  }
  const runName = (j) => j.label || t("runOf", { when: when(j.submitted_at) || "?" });
  const isStopped = (j) => j.status === "error" && /^(Cancelled|Interrupted|Stopped)/.test(j.error || "");

  // ---------- period helpers (date pickers ↔ year / month / day parameters) ----------
  function periodOf(params) {
    if (!DI || !params) return null;
    const y = params[DI.year], sm = params[DI.start_month], sd = params[DI.start_day], em = params[DI.end_month], ed = params[DI.end_day];
    if ([y, sm, sd, em, ed].some(v => v == null || Number.isNaN(Number(v)))) return null;
    return { start: new Date(y, sm - 1, sd), end: new Date(y, em - 1, ed) };
  }
  function periodLabel(params) {
    const p = periodOf(params);
    return p ? `${dayFmt(p.start, false)} – ${dayFmt(p.end)}` : "—";
  }
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);

  // ---------- form ----------
  const otherParams = () => CFG.parameters.filter(p => !DI || !Object.values(DI).includes(p.name));
  const defaults = () => Object.fromEntries(CFG.parameters.map(p => [p.name, p.default]));

  function buildForm(values) {
    let html = "";
    if (DI) {
      const p = periodOf(values) || periodOf(defaults());
      html += `
        <div class="field" data-kind="date">
          <label for="d_start">${esc(t("startDate"))}</label>
          <input id="d_start" type="date" value="${isoDay(p.start)}" ${DI.min ? `min="${esc(DI.min)}"` : ""}>
        </div>
        <div class="field" data-kind="date">
          <label for="d_end">${esc(t("endDate"))}</label>
          <input id="d_end" type="date" value="${isoDay(p.end)}" ${DI.min ? `min="${esc(DI.min)}"` : ""}>
          <small>${esc(t("dateHelp"))}</small>
        </div>`;
    }
    html += otherParams().map(p => {
      const unit = L(p, "unit");
      return `
      <div class="field" data-kind="num">
        <label for="p_${esc(p.name)}">${esc(L(p, "label"))}${unit ? ` <span class="opt">(${esc(unit)})</span>` : ""}</label>
        <input id="p_${esc(p.name)}" type="number" inputmode="decimal" value="${esc(values?.[p.name] ?? p.default)}"
          min="${esc(p.min)}" max="${esc(p.max)}" step="${esc(p.step ?? "any")}">
        <small>${esc(L(p, "help"))}${p.min !== undefined ? ` ${esc(t("range", { min: p.min, max: p.max }))}` : ""}</small>
      </div>`; }).join("");
    $("fields").innerHTML = html;
    document.querySelectorAll("#fields input").forEach(i => i.addEventListener("input", () => { updatePeriodPreview(); $("formError").hidden = true; saveForm(); }));
    updatePeriodPreview();
  }

  function readForm() {
    const params = {}; let error = null;
    document.querySelectorAll("#fields .field").forEach(f => f.classList.remove("invalid"));
    if (DI) {
      const s = $("d_start").value, e = $("d_end").value;
      if (!s) { $("d_start").closest(".field").classList.add("invalid"); error = t("eStart"); }
      if (!e) { $("d_end").closest(".field").classList.add("invalid"); error = error || t("eEnd"); }
      if (s && e) {
        const a = parseDay(s), b = parseDay(e);
        if (a.getFullYear() !== b.getFullYear()) { $("d_end").closest(".field").classList.add("invalid"); error = t("eYear"); }
        else if (b < a) { $("d_end").closest(".field").classList.add("invalid"); error = t("eOrder"); }
        params[DI.year] = a.getFullYear();
        params[DI.start_month] = a.getMonth() + 1; params[DI.start_day] = a.getDate();
        params[DI.end_month] = b.getMonth() + 1; params[DI.end_day] = b.getDate();
      }
    }
    otherParams().forEach(p => {
      const inp = $(`p_${p.name}`); const v = Number(inp.value);
      if (inp.value === "" || Number.isNaN(v) || (p.min != null && v < p.min) || (p.max != null && v > p.max)) {
        inp.closest(".field").classList.add("invalid"); error = error || t("eRange", { label: L(p, "label"), min: p.min, max: p.max });
      }
      params[p.name] = v;
    });
    return { params, error };
  }
  // 參數記憶：每次修改就存，下次打開自動帶回（按「重設」才清除）
  function saveForm() { const v = currentFormValues(); if (Object.keys(v).length) store("simLastParams", JSON.stringify(v)); }
  $("f_label").addEventListener("input", () => store("simLabel", $("f_label").value));
  $("f_who").addEventListener("input", () => store("simWho", $("f_who").value.trim()));

  // 沒有存過的參數（例如換一台電腦）：從最近一次送出的模擬帶入
  function restoreFromJob(job) {
    if (!job) return false;
    let changed = false;
    if (!load("simLastParams") && job.parameters) { buildForm(job.parameters); saveForm(); changed = true; }
    if (PD() && !load("simPlans") && job.plans) {
      for (const [name, pl] of Object.entries(job.plans)) {
        const inputs = {}; (pl.rows || []).forEach(r => { if (r.input > 0) inputs[r.date] = r.input; });
        const overrides = {}; (pl.rows || []).forEach(r => { if (r.override) overrides[r.date] = r.override; });
        PLANS[name] = { target: pl.target, sat_off: !!pl.sat_off, sun_off: !!pl.sun_off, inputs, overrides };
      }
      savePlans(); changed = true;
    }
    if (SH() && !load("simShifts") && job.shifts) {
      for (const [name, sf] of Object.entries(job.shifts)) SHIFTS[name] = { count: sf.count, grids: sf.grids.map(g => g.map(r => r.slice())) };
      saveShifts(); changed = true;
    }
    return changed;
  }

  function currentFormValues() {
    const v = {};
    if (DI && $("d_start") && $("d_start").value && $("d_end").value) {
      const a = parseDay($("d_start").value), b = parseDay($("d_end").value);
      Object.assign(v, { [DI.year]: a.getFullYear(), [DI.start_month]: a.getMonth() + 1, [DI.start_day]: a.getDate(),
                         [DI.end_month]: b.getMonth() + 1, [DI.end_day]: b.getDate() });
    }
    otherParams().forEach(p => { const i = $(`p_${p.name}`); if (i) v[p.name] = i.value; });
    return v;
  }

  function updatePeriodPreview() {
    if (!DI) { $("periodDays").hidden = true; return; }
    const s = $("d_start").value, e = $("d_end").value;
    if (!s || !e) { $("periodDays").textContent = ""; return; }
    const n = daysBetween(parseDay(s), parseDay(e)) + 1;
    $("periodDays").textContent = n > 0 ? t("calDays", { n }) : "";
    renderPlan();
    if (!activeId && stateMode === "idle") drawTimeline(parseDay(s), parseDay(e), null, "idle");
  }

  // ---------- daily input plan ----------
  const MON3 = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WD3 = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const PD = () => CFG.daily_input;
  let PLANS = {}, planProduct = load("simPlanProduct");
  try { PLANS = JSON.parse(load("simPlans") || "{}") || {}; } catch (e) { PLANS = {}; }
  const savePlans = () => store("simPlans", JSON.stringify(PLANS));

  function nthWeekday(y, m, wd, n) { const d = new Date(y, m, 1); d.setDate(1 + ((wd - d.getDay() + 7) % 7) + 7 * (n - 1)); return d; }
  function lastWeekday(y, m, wd) { const d = new Date(y, m + 1, 0); d.setDate(d.getDate() - ((d.getDay() - wd + 7) % 7)); return d; }
  function observed(d) { const x = new Date(d); if (x.getDay() === 6) x.setDate(x.getDate() - 1); else if (x.getDay() === 0) x.setDate(x.getDate() + 1); return x; }
  function federalHolidays(y) {
    const list = [
      [observed(new Date(y, 0, 1)), "New Year's Day"], [nthWeekday(y, 0, 1, 3), "Martin Luther King Jr. Day"],
      [nthWeekday(y, 1, 1, 3), "Washington's Birthday"], [lastWeekday(y, 4, 1), "Memorial Day"],
      [observed(new Date(y, 5, 19)), "Juneteenth"], [observed(new Date(y, 6, 4)), "Independence Day"],
      [nthWeekday(y, 8, 1, 1), "Labor Day"], [nthWeekday(y, 9, 1, 2), "Columbus Day"],
      [observed(new Date(y, 10, 11)), "Veterans Day"], [nthWeekday(y, 10, 4, 4), "Thanksgiving Day"],
      [observed(new Date(y, 11, 25)), "Christmas Day"],
    ];
    const nx = observed(new Date(y + 1, 0, 1)); if (nx.getFullYear() === y) list.push([nx, "New Year's Day"]);
    return Object.fromEntries(list.map(([d, n]) => [isoDay(d), n]));
  }
  function planFor(name) {
    const d = PD().defaults || {};
    if (!PLANS[name]) PLANS[name] = { target: d.target ?? 0, sat_off: !!d.sat_off, sun_off: d.sun_off ?? true, inputs: {} };
    if (!PLANS[name].overrides) PLANS[name].overrides = {};
    return PLANS[name];
  }
  function currentPeriod() {
    const s = $("d_start")?.value, e = $("d_end")?.value;
    if (!s || !e) return null;
    const a = parseDay(s), b = parseDay(e);
    return b >= a && daysBetween(a, b) < 400 ? { start: a, end: b } : null;
  }
  // 與 schedule.py 相同的規則
  function computePlan(name, per) {
    const pl = planFor(name), fed = {};
    if (PD().federal_holidays !== false) for (let y = per.start.getFullYear(); y <= per.end.getFullYear(); y++) Object.assign(fed, federalHolidays(y));
    const rows = [];
    for (let d = new Date(per.start); d <= per.end; d.setDate(d.getDate() + 1)) {
      const iso = isoDay(d), wd = d.getDay();
      const base = fed[iso] || (wd === 6 && pl.sat_off ? "SAT" : wd === 0 && pl.sun_off ? "SUN" : null);
      const ov = pl.overrides[iso];
      const reason = ov === "work" ? null : ov === "off" ? (base || "MANUAL") : base;
      const raw = pl.inputs[iso];
      const input = reason || raw === "" || raw == null ? 0 : Math.max(0, Number(raw) || 0);
      rows.push({ iso, month: MON3[d.getMonth()], week: Math.ceil(d.getDate() / 7), day: d.getDate(), weekday: WD3[wd], input, holiday: reason, base, fed: !!fed[iso],
        changed: ov != null && (ov === "work") === !!base });
    }
    const filled = rows.reduce((a, r) => a + r.input, 0);
    const open = rows.filter(r => !r.holiday && r.input <= 0).length;
    const target = Number(pl.target) || 0;
    const perDay = open ? Math.round((target - filled) / open * 100) / 100 : 0;
    rows.forEach(r => r.suggest = r.holiday ? 0 : r.input > 0 ? r.input : perDay);
    return { rows, filled, perDay, target, open, work: rows.filter(r => !r.holiday).length, fed };
  }

  function renderPlan() {
    if (!PD()) return;
    const per = currentPeriod();
    $("planNoPeriod").hidden = !!per; $("planBody").hidden = !per;
    renderInNav();
    if (!per) return;
    const prods = PD().products;
    if (!prods.find(p => p.name === planProduct)) planProduct = prods[0].name;
    $("planSeg").innerHTML = prods.map(p => `<button type="button" data-p="${esc(p.name)}" aria-pressed="${p.name === planProduct}">${esc(L(p, "label"))}</button>`).join("");
    $("planSeg").querySelectorAll("button").forEach(b => b.onclick = () => { planProduct = b.dataset.p; store("simPlanProduct", planProduct); $("fillMsg").textContent = ""; renderPlan(); });
    const pl = planFor(planProduct);
    if (document.activeElement !== $("planTarget")) $("planTarget").value = pl.target;
    $("planSat").checked = !!pl.sat_off; $("planSun").checked = !!pl.sun_off;
    const c = computePlan(planProduct, per);
    renderPlanSummary(c);
    const reasonText = (k) => k === "SAT" ? t("hSat") : k === "SUN" ? t("hSun") : k === "MANUAL" ? t("hManual") : k;
    $("planTable").innerHTML = `<thead><tr><th class="l">${esc(t("thDate"))}</th><th>${esc(t("thWeek"))}</th><th class="l">${esc(t("thWeekday"))}</th>` +
      `<th>${esc(t("thInput"))}</th><th>${esc(t("thSuggest"))}</th><th class="l">${esc(t("thRest"))}</th></tr></thead><tbody>` +
      c.rows.map((r, i) => `<tr class="${r.holiday ? "hol" : ""}">
        <td class="l">${esc(r.month)} ${r.day}</td><td>${r.week}</td><td class="l">${esc(r.weekday)}</td>
        <td class="in"><input type="number" min="0" step="1" inputmode="numeric" data-iso="${r.iso}" data-i="${i}"
          value="${r.holiday ? "" : esc(pl.inputs[r.iso] ?? "")}" ${r.holiday ? "disabled" : ""} class="${!r.holiday && r.input > 0 ? "filled" : ""}"
          aria-label="${esc(t("thInput"))} ${esc(r.month)} ${r.day}"></td>
        <td class="sug${r.suggest < 0 ? " neg" : ""}" data-sug="${i}">${fmt(r.suggest, Number.isInteger(r.suggest) ? 0 : 2)}</td>
        <td class="l hcell"><label class="rest${r.changed ? " changed" : ""}"><input type="checkbox" data-rest="${r.iso}" ${r.holiday ? "checked" : ""}
          aria-label="${esc(t("thRest"))} ${esc(r.month)} ${r.day}"><span>${r.holiday ? `<b>Y</b> ${esc(reasonText(r.holiday))}` : esc(t("workDay"))}</span>${r.changed
          ? `<small>${esc(r.holiday ? t("exOff") : t("exWork", { r: reasonText(r.base) }))}</small>` : ""}</label></td></tr>`).join("") + "</tbody>";
    $("planTable").querySelectorAll("input[data-rest]").forEach(cb => cb.addEventListener("change", () => {
      const iso = cb.dataset.rest, row = c.rows.find(x => x.iso === iso);
      if (cb.checked === !!row.base) delete pl.overrides[iso];       // back to the normal rule
      else pl.overrides[iso] = cb.checked ? "off" : "work";        // exception
      if (cb.checked) delete pl.inputs[iso];
      savePlans(); renderPlan();
    }));
    const inputs = [...$("planTable").querySelectorAll("input:not([disabled])")];
    inputs.forEach((inp, k) => {
      inp.addEventListener("input", () => {
        const v = inp.value.trim();
        if (v === "" || Number(v) <= 0) delete pl.inputs[inp.dataset.iso]; else pl.inputs[inp.dataset.iso] = Number(v);
        inp.classList.toggle("filled", v !== "" && Number(v) > 0);
        savePlans(); refreshSuggest(); renderInNav();
      });
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); (inputs[k + (e.shiftKey ? -1 : 1)] || inp).focus(); } });
      inp.addEventListener("paste", (e) => {
        const text = (e.clipboardData || window.clipboardData)?.getData("text") || "";
        const vals = text.split(/\r?\n/).map(x => x.split("\t")[0].replace(/,/g, "").trim()).filter((x, idx, arr) => !(idx === arr.length - 1 && x === ""));
        if (vals.length < 2) return;
        e.preventDefault();
        vals.forEach((v, j) => {
          const target = inputs[k + j]; if (!target) return;
          if (v === "" || Number.isNaN(Number(v)) || Number(v) <= 0) delete pl.inputs[target.dataset.iso]; else pl.inputs[target.dataset.iso] = Number(v);
        });
        savePlans(); renderPlan();
      });
    });
  }
  function refreshSuggest() {
    const per = currentPeriod(); if (!per) return;
    const c = computePlan(planProduct, per);
    renderPlanSummary(c);
    c.rows.forEach((r, i) => { const td = $("planTable").querySelector(`[data-sug="${i}"]`); if (td) { td.textContent = fmt(r.suggest, Number.isInteger(r.suggest) ? 0 : 2); td.classList.toggle("neg", r.suggest < 0); } });
  }
  function renderPlanSummary(c) {
    const remain = c.target - c.filled;
    $("planStats").innerHTML = [["sWorkDays", fmt(c.work, 0), false], ["sFilled", fmt(c.filled, 0), false],
      ["sRemain", fmt(remain, 0), remain < 0], ["sPerDay", c.open ? fmt(c.perDay, 2) : "—", c.perDay < 0]]
      .map(([k, v, neg]) => `<div><dt>${esc(t(k))}</dt><dd class="${neg ? "neg" : ""}">${v}</dd></div>`).join("");
    const fed = Object.entries(c.fed).filter(([iso]) => c.rows.some(r => r.iso === iso));
    $("planHolidays").textContent = PD().federal_holidays === false ? "" : fed.length
      ? t("fedHol", { list: fed.map(([iso, n]) => `${dayFmt(parseDay(iso), false)} ${n}`).join(LANG === "zh" ? "、" : ", ") }) : t("noFedHol");
    $("planWarn").hidden = remain >= 0; $("planWarn").textContent = t("overTarget");
  }
  function plansForSubmit() {
    const per = currentPeriod(); if (!PD() || !per) return null;
    const out = {};
    for (const p of PD().products) {
      const pl = planFor(p.name), c = computePlan(p.name, per);
      const inputs = {}; c.rows.forEach(r => { if (r.input > 0) inputs[r.iso] = r.input; });
      const overrides = {}; c.rows.forEach(r => { if (r.changed) overrides[r.iso] = r.holiday ? "off" : "work"; });
      out[p.name] = { target: Number(pl.target) || 0, sat_off: !!pl.sat_off, sun_off: !!pl.sun_off, inputs, overrides };
    }
    return out;
  }
  $("planTarget").addEventListener("input", () => { const pl = planFor(planProduct); pl.target = $("planTarget").value === "" ? 0 : Number($("planTarget").value); savePlans(); refreshSuggest(); renderInNav(); });
  $("planSat").addEventListener("change", () => { planFor(planProduct).sat_off = $("planSat").checked; savePlans(); renderPlan(); });
  $("planSun").addEventListener("change", () => { planFor(planProduct).sun_off = $("planSun").checked; savePlans(); renderPlan(); });
  // ---- quick fill: spread target evenly, or the same amount every work day ----
  function quickFill(kind) {
    const per = currentPeriod(); if (!per) return;
    const pl = planFor(planProduct), c = computePlan(planProduct, per);
    const onlyEmpty = $("fillOnlyEmpty").checked;
    const work = c.rows.filter(r => !r.holiday);
    const days = onlyEmpty ? work.filter(r => r.input <= 0) : work;
    const msg = (k, v) => { $("fillMsg").textContent = t(k, v); };
    if (!days.length) return msg("fillNone");
    let each = null;
    if (kind === "each") {
      const v = $("fillEach").value.trim();
      if (v === "" || !(Number(v) > 0)) { $("fillEach").focus(); return msg("fillNeedValue"); }
      each = Math.round(Number(v));
    }
    const prior = work.filter(r => r.input > 0).length;
    if (!onlyEmpty && prior) {
      const p = PD().products.find(x => x.name === planProduct);
      if (!confirm(t("confirmOverwrite", { n: prior, p: L(p, "label") }))) return;
    }
    if (!onlyEmpty) pl.inputs = {};
    if (kind === "spread") {
      const kept = onlyEmpty ? c.filled : 0;
      const total = Math.round((Number(pl.target) || 0) - kept);
      if (total <= 0) { savePlans(); renderPlan(); return msg("fillNothingLeft"); }
      // whole units: everyone gets the base, the first few work days take the remainder
      const base = Math.floor(total / days.length), r = total - base * days.length;
      days.forEach((row, i) => { const v = base + (i < r ? 1 : 0); if (v > 0) pl.inputs[row.iso] = v; });
      savePlans(); renderPlan(); renderInNav();
      msg("fillDoneSpread", { n: fmt(total, 0), d: days.length, base: fmt(base, 0), extra: r ? t("fillExtra", { r }) : "" });
    } else {
      days.forEach(row => { pl.inputs[row.iso] = each; });
      pl.target = computePlan(planProduct, per).filled;  // only days inside the period count
      savePlans(); renderPlan(); renderInNav();
      msg("fillDoneEach", { v: fmt(each, 0), d: days.length, total: fmt(pl.target, 0) });
    }
  }
  $("fillSpread").addEventListener("click", () => quickFill("spread"));
  $("fillEachBtn").addEventListener("click", () => quickFill("each"));
  $("fillEach").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); quickFill("each"); } });
  $("planClear").addEventListener("click", () => {
    const p = PD().products.find(x => x.name === planProduct);
    if (!confirm(t("confirmClear", { p: L(p, "label") }))) return;
    planFor(planProduct).inputs = {}; planFor(planProduct).overrides = {}; savePlans(); renderPlan();
  });

  // ---------- input categories ----------
  let IN_CAT = load("simInCat") || "basic";
  function inCats() {
    const c = [{ k: "basic", label: t("catBasic") }];
    if (PD()) c.push({ k: "plan", label: t("catPlan") });
    if (SH()) c.push({ k: "shift", label: t("catShift") });
    return c;
  }
  function inSummary(k) {
    if (k === "basic") { const p = currentPeriod(); return p ? `${dayFmt(p.start, false)} – ${dayFmt(p.end)}` : "—"; }
    if (k === "plan") return PD().products.map(p => `${L(p, "label")} ${fmt(Number(planFor(p.name).target) || 0, 0)}`).join(", ");
    if (k === "shift") return SH().products.map(p => t("sumShift", { p: L(p, "label"), n: shiftFor(p.name).count })).join(", ");
    return "";
  }
  function renderInNav() {
    if (!CFG) return;
    const cats = inCats();
    if (!cats.find(c => c.k === IN_CAT)) IN_CAT = "basic";
    $("inNav").innerHTML = `<div class="grp">${esc(t("grpInputs"))}</div>` + cats.map(c =>
      `<button type="button" data-k="${c.k}" aria-current="${c.k === IN_CAT}"><b>${esc(c.label)}</b><small>${esc(inSummary(c.k))}</small></button>`).join("");
    $("inNav").querySelectorAll("button").forEach(b => b.onclick = () => showInCat(b.dataset.k));
    document.querySelectorAll("#app [data-cat]").forEach(sec => sec.hidden = sec.dataset.cat !== IN_CAT);
  }
  function showInCat(k) { IN_CAT = k; store("simInCat", k); renderInNav(); if (k === "plan") renderPlan(); if (k === "shift") renderShifts(); }

  // ---------- shifts ----------
  const SH = () => CFG.shifts;
  let SHIFTS = {}, shiftProduct = load("simShiftProduct");
  try { SHIFTS = JSON.parse(load("simShifts") || "{}") || {}; } catch (e) { SHIFTS = {}; }
  const saveShifts = () => store("simShifts", JSON.stringify(SHIFTS));
  function defaultGrid() { const d = SH().defaults.values; return SH().rows.map(() => SH().columns.map((_, j) => d[j] ?? 0)); }
  function shiftFor(name) {
    const ok = (g) => Array.isArray(g) && g.length === SH().rows.length && g.every(r => Array.isArray(r) && r.length === SH().columns.length);
    let s = SHIFTS[name];
    if (!s || !Array.isArray(s.grids)) s = SHIFTS[name] = { count: SH().defaults.count || 2, grids: [] };
    for (let i = 0; i < 2; i++) if (!ok(s.grids[i])) s.grids[i] = defaultGrid();
    return s;
  }
  function renderShifts() {
    if (!SH()) return;
    const prods = SH().products;
    if (!prods.find(p => p.name === shiftProduct)) shiftProduct = prods[0].name;
    $("shiftSeg").innerHTML = prods.map(p => `<button type="button" data-p="${esc(p.name)}" aria-pressed="${p.name === shiftProduct}">${esc(L(p, "label"))}</button>`).join("");
    $("shiftSeg").querySelectorAll("button").forEach(b => b.onclick = () => { shiftProduct = b.dataset.p; store("simShiftProduct", shiftProduct); renderShifts(); });
    const sf = shiftFor(shiftProduct);
    document.querySelectorAll('input[name="shiftCount"]').forEach(r => r.checked = Number(r.value) === sf.count);
    $("shiftCopy").hidden = sf.count < 2;
    const max = SH().max || 24;
    $("shiftGrids").innerHTML = [0, 1].map(gi => {
      const off = gi >= sf.count;
      return `<div class="shift-grid${off ? " off" : ""}" data-off="${esc(t("shiftOff"))}"><h3>${esc(t("shiftN", { n: gi + 1 }))}</h3>
        <div class="table-wrap"><table class="shift"><thead><tr><th class="l"></th>${SH().columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
        SH().rows.map((rw, ri) => `<tr><th class="l">${esc(rw)}</th>${SH().columns.map((c, ci) =>
          `<td><input type="number" min="0" max="${max}" step="0.5" inputmode="decimal" data-g="${gi}" data-r="${ri}" data-c="${ci}" value="${esc(sf.grids[gi][ri][ci])}" ${off ? "disabled" : ""} aria-label="${esc(t("shiftN", { n: gi + 1 }))} ${esc(rw)} ${esc(c)}"></td>`).join("")}</tr>`).join("") +
        `</tbody></table></div></div>`;
    }).join("");
    $("shiftGrids").querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
      sf.grids[+inp.dataset.g][+inp.dataset.r][+inp.dataset.c] = inp.value === "" ? 0 : Number(inp.value);
      saveShifts();
    }));
    renderInNav();
  }
  document.querySelectorAll('input[name="shiftCount"]').forEach(r => r.addEventListener("change", () => { shiftFor(shiftProduct).count = Number(r.value); saveShifts(); renderShifts(); }));
  $("shiftCopy").addEventListener("click", () => { const sf = shiftFor(shiftProduct); sf.grids[1] = sf.grids[0].map(r => r.slice()); saveShifts(); renderShifts(); });
  $("shiftDefault").addEventListener("click", () => { SHIFTS[shiftProduct] = null; shiftFor(shiftProduct); saveShifts(); renderShifts(); });
  function shiftsForSubmit() {
    if (!SH()) return { data: null, error: null };
    const max = SH().max || 24, out = {};
    for (const p of SH().products) {
      const sf = shiftFor(p.name);
      for (let gi = 0; gi < sf.count; gi++)
        if (sf.grids[gi].some(r => r.some(v => !(Number(v) >= 0 && Number(v) <= max))))
          return { data: null, error: t("eShift", { p: L(p, "label"), n: gi + 1, max }), product: p.name };
      out[p.name] = { count: sf.count, grids: sf.grids.slice(0, 2).map(g => g.map(r => r.map(Number))) };
    }
    return { data: out, error: null };
  }

  // ---------- console ----------
  function drawTimeline(start, end, atDate, kind) {
    $("endStart").innerHTML = start ? `${esc(dayFmt(start))}<small>${esc(t("startLbl"))}</small>` : "—";
    $("endEnd").innerHTML = end ? `${esc(dayFmt(end))}<small>${esc(t("endLbl"))}</small>` : "—";
    let pct = 0;
    if (kind === "done") pct = 100;
    else if (start && end && atDate) pct = Math.max(0, Math.min(100, (atDate - start) / ((end - start) + 86400000) * 100));
    $("fill").style.width = pct + "%";
    $("fill").classList.toggle("complete", kind === "done");
    let ticks = "";
    if (start && end && end > start) {
      const total = (end - start) + 86400000;
      const d = new Date(start.getFullYear(), start.getMonth() + 1, 1);
      const months = [];
      while (d <= end) { months.push(new Date(d)); d.setMonth(d.getMonth() + 1); }
      const every = Math.ceil(months.length / 6);
      months.forEach((m, i) => {
        if (i % every) return;
        const x = (m - start) / total * 100;
        if (x > 6 && x < 94) ticks += `<span class="tick" style="left:${x}%">${esc(m.toLocaleDateString(locale(), { month: "short" }))}</span>`;
      });
    }
    $("ticks").innerHTML = ticks;
  }

  function setState(tagCls, tag, msg, sub, spinning) {
    $("state").innerHTML = `${spinning ? '<span class="spin" aria-hidden="true"></span>' : ""}<span class="tag ${tagCls}">${esc(tag)}</span>` +
      `<span class="msg">${esc(msg)}${sub ? ` <span class="sub">${esc(sub)}</span>` : ""}</span>`;
  }
  function setIdle(msgKey = "idleMsg") {
    stateMode = "idle"; shownJob = null;
    setState("", t("idle"), t(msgKey), "", false);
    updatePeriodPreview();
  }

  function renderJob(job) {
    shownJob = job; stateMode = "job";
    const p = periodOf(job.parameters);
    switch (job.status) {
      case "submitted":
        setState("wait", t("sent"), t("sentMsg"), t("sentSub"), true);
        drawTimeline(p?.start, p?.end, null, "wait"); break;
      case "queued":
        setState("wait", t("queued"), job.queue_position > 1 ? t("queuePos", { n: job.queue_position }) : t("queueNext"), "", true);
        drawTimeline(p?.start, p?.end, null, "wait"); break;
      case "running": {
        if (job.id === activeId) activeJob = job;
        if (pending && job.id === activeId) {
          const done = (pending === "pause" && job.paused) || (pending !== "pause" && !job.paused && job.mode === pending);
          if (done) pending = null;
        }
        const at0 = job.progress_date ? parseDay(job.progress_date) : null;
        if (pending && job.id === activeId) {
          const msg = pending === "pause" ? ["pausing", "pausingMsg"] : job.paused ? ["resuming", "resumingMsg"] : ["switching", pending === "fast" ? "toFast" : "toRun"];
          setState("wait", t(msg[0]), t(msg[1]), t("syncSub"), true);
          drawTimeline(p?.start, p?.end, at0, "run");
          if (job.mode !== "fast") showLive(job);
          break;
        }
        if (job.paused) {
          setState("wait", t("paused"), at0 ? t("pausedMsg", { date: dayFmt(at0) }) : t("pausedMsgNoDate"),
            t("pausedSub", { n: (CFG && CFG.max_pause_minutes) || 60 }), false);
          drawTimeline(p?.start, p?.end, at0, "run");
          if (job.mode !== "fast" && job.id === activeId) showLive(job);
          break;
        }
        if (job.mode === "fast") {
          const atf = job.progress_date ? parseDay(job.progress_date) : null;
          if (job.progress == null || !atf) setState("running", t("fast"), t("ffMsg"), t("ffWait"), true);
          else setState("running", t("fast"), t(p && atf < p.start ? "ffWarm" : "ffThrough", { date: dayFmt(atf) }), t("ffSub", { p: fmt(job.progress * 100, 0) }), true);
          drawTimeline(p?.start, p?.end, atf, "run");
          break;
        }
        if (job.progress == null) { setState("running", t("running"), t("starting"), "", true); drawTimeline(p?.start, p?.end, null, "run"); break; }
        const at = job.progress_date ? parseDay(job.progress_date) : null;
        const before = p && at && at < p.start;
        setState("running", t("running"), at ? t(before ? "warming" : "through", { date: dayFmt(at) }) : t("starting"),
          t("pctModel", { p: fmt(job.progress * 100, 0) }), true);
        drawTimeline(p?.start, p?.end, at, "run");
        if (job.id === activeId) showLive(job);
        break;
      }
      case "done":
        setState("done", t("finished"), t("finishedMsg", { when: when(job.finished_at) }), job.wall_seconds ? t("took", { s: fmt(job.wall_seconds, 0) }) : "", false);
        $("state").insertAdjacentHTML("beforeend", `<button type="button" class="goto" data-run="${esc(job.id)}">${esc(t("viewOutput"))}</button>`);
        $("state").querySelector(".goto").onclick = (e) => { outRunId = e.currentTarget.dataset.run; showTab("output"); };
        drawTimeline(p?.start, p?.end, null, "done"); break;
      default:
        setState(isStopped(job) ? "wait" : "error", isStopped(job) ? t("stopped") : t("failed"), errText(job.error), "", false);
        drawTimeline(p?.start, p?.end, null, "idle");
    }
    syncButtons();
  }

  function syncButtons() {
    const busy = !!activeId;
    const j = busy ? activeJob : null;
    const running = j && j.status === "running";
    const paused = running && j.paused;
    if (!busy) {
      $("btnRun").disabled = false; $("btnFast").disabled = false;
    } else {
      // 執行中：可以在「執行／快轉」之間切換；暫停中：兩個都能用來繼續
      $("btnRun").disabled = !running || (!paused && j.mode !== "fast") || !!pending;
      $("btnFast").disabled = !running || (!paused && j.mode === "fast") || !!pending;
    }
    $("btnPause").disabled = !running || paused || !!pending;
    $("btnStop").disabled = !busy;
    $("livePanel").hidden = !busy;  // 參數調整頁只在執行中顯示即時數值，完成後到「指標呈現」看
  }

  // ---------- who / which device (no IP is available to a page opened from a file) ----------
  function clientInfo() {
    let id = load("simDevice");
    if (!id) { id = Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, "0")).join("").toUpperCase(); store("simDevice", id); }
    const ua = navigator.userAgent || "";
    const os = /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "macOS" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Linux/.test(ua) ? "Linux" : "Other";
    const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
    let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    const off = -new Date().getTimezoneOffset();
    const utc = `UTC${off >= 0 ? "+" : "−"}${Math.floor(Math.abs(off) / 60)}${Math.abs(off) % 60 ? ":" + pad(Math.abs(off) % 60) : ""}`;
    return { device_id: id, os, browser: br, timezone: tz, utc_offset: utc, language: navigator.language || "", local_time: new Date().toString().slice(0, 24) };
  }

  // ---------- actions ----------
  async function submit(mode) {
    $("formError").hidden = true;
    const { params, error } = readForm();
    if (error) { showInCat("basic"); $("formError").textContent = error; $("formError").hidden = false; return; }
    const who = $("f_who").value.trim();
    if (!who) { showInCat("basic"); $("f_who").closest(".field").classList.add("invalid"); $("formError").textContent = t("eName"); $("formError").hidden = false; $("f_who").focus(); return; }
    $("f_who").closest(".field").classList.remove("invalid");
    store("simLastParams", JSON.stringify(params));
    store("simWho", who);
    $("btnRun").disabled = $("btnFast").disabled = true;
    try {
      const plans = plansForSubmit();
      const sh = shiftsForSubmit();
      if (sh.error) { shiftProduct = sh.product; showInCat("shift"); alert(sh.error); $("btnRun").disabled = $("btnFast").disabled = false; return; }
      const job = await T.submit({ parameters: params, run_length: null, mode, label: $("f_label").value.trim() || null, submitted_by: who, client: clientInfo(), plans, shifts: sh.data });
      activeId = selectedId = job.id; activeJob = job; pending = null;
      renderJob(job);
      if (mode !== "fast") showLive(job);
      await refreshHistory();
      poll(job.id);
    } catch (err) {
      $("formError").textContent = err.message; $("formError").hidden = false;
      activeId = null; syncButtons();
    }
  }
  async function sendControl(action) {
    if (!activeId) return;
    pending = action;
    if (activeJob) renderJob(activeJob);
    syncButtons();
    try { await T.control(activeId, action); }
    catch (e) { pending = null; syncButtons(); alert(e.message); }
  }
  $("btnRun").addEventListener("click", () => activeId ? sendControl("run") : submit("run"));
  $("btnFast").addEventListener("click", () => activeId ? sendControl("fast") : submit("fast"));
  $("btnPause").addEventListener("click", () => sendControl("pause"));
  $("form").addEventListener("submit", (e) => { e.preventDefault(); submit("run"); });

  $("btnStop").addEventListener("click", async () => {
    if (!activeId || !confirm(t("confirmStop"))) return;
    $("btnStop").disabled = true; pending = null;
    setState("wait", t("stopping"), t("stoppingMsg"), t("stoppingSub"), true);
    try { await T.cancel(activeId); } catch (e) { $("btnStop").disabled = false; alert(e.message); }
  });

  // Reset: like FlexSim's Reset — back to the start, inputs untouched
  $("btnReset").addEventListener("click", () => {
    $("formError").hidden = true;
    if (!activeId) {
      selectedId = null;
      clearResults();
      setIdle("resetMsg");
      renderBars(); renderTable();
    }
  });
  // Restoring defaults is a separate, confirmed action
  $("btnDefaults").addEventListener("click", () => {
    if (!confirm(t("confirmDefaults"))) return;
    PLANS = {}; savePlans(); SHIFTS = {}; saveShifts();
    store("simLastParams"); store("simLabel");
    buildForm(defaults());
    $("f_label").value = "";
    $("formError").hidden = true;
    renderPlan(); renderShifts(); renderInNav();
    if (!activeId) setIdle("defaultsMsg");
  });

  function poll(id) {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => {
      try {
        const job = await T.getJob(id);
        if (ACTIVE.includes(job.status)) { activeJob = job; renderJob(job); return poll(id); }
        activeId = null; activeJob = null; pending = null;
        renderJob(job);
        await refreshHistory();
        refreshSimStatus().catch(() => {});
        if (job.status === "done") showResult(job);
      } catch (err) {
        activeId = null;
        setState("error", t("failed"), err.message, "", false); syncButtons();
      }
    }, T.pollMs);
  }

  // ---------- results ----------
  function clearResults() {
    $("resultsTitle").textContent = t("results");
    $("resultsMeta").hidden = true;
    $("kpis").innerHTML = `<div class="empty">${esc(t("resultsEmpty"))}</div>`;
  }

  function spark(series, name) {
    const pts = (series || []).map(p => p.m?.[name]).filter(v => v != null && !Number.isNaN(Number(v))).map(Number);
    if (pts.length < 2) return "";
    const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
    if (hi === lo) return "";
    const xy = pts.map((v, i) => [i / (pts.length - 1) * 100, 30 - (v - lo) / span * 26]);
    return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="${xy.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ")}"/></svg>`;
  }

  function kpiTiles(metrics, series, prev) {
    return CFG.metrics.map(m => {
      const v = metrics?.[m.name];
      let delta = "", cls = "";
      const pv = prev?.metrics?.[m.name];
      if (prev && v != null && pv != null && pv !== 0) {
        const pct = (v - pv) / Math.abs(pv) * 100;
        if (Math.abs(pct) < 0.05) delta = t("same");
        else { delta = t(pct > 0 ? "up" : "down", { p: fmt(Math.abs(pct), 1) }); cls = pct > 0 ? "up" : "down"; }
      }
      const unit = L(m, "unit");
      return `<div class="kpi"><div class="k">${esc(L(m, "label"))}</div>
        <div class="v">${fmt(v, m.decimals ?? 1)}${unit ? `<small>${esc(unit)}</small>` : ""}</div>
        ${spark(series, m.name)}
        <div class="d ${cls}">${esc(delta)}</div></div>`;
    }).join("");
  }

  function showResult(job) {
    selectedId = job.id;
    $("resultsTitle").textContent = runName(job);
    $("resultsMeta").hidden = false;
    $("resultsMeta").textContent = periodLabel(job.parameters) + (job.submitted_by ? t("runBy", { who: job.submitted_by }) : "");
    const prev = history.find(h => h.status === "done" && h.id !== job.id && new Date(h.submitted_at) < new Date(job.submitted_at));
    $("kpis").innerHTML = kpiTiles(job.metrics, job.series, prev);
    renderBars(); renderTable();
  }

  function showLive(job) {
    $("resultsTitle").innerHTML = `${esc(runName(job))}<span class="live-tag">${esc(t("liveTag"))}</span>`;
    $("resultsMeta").hidden = false;
    if (!job.live_metrics) {
      $("resultsMeta").textContent = periodLabel(job.parameters);
      $("kpis").innerHTML = `<div class="empty">${esc(t("liveWait"))}</div>`;
      return;
    }
    $("resultsMeta").textContent = t("liveMeta", { date: job.progress_date ? dayFmt(parseDay(job.progress_date)) : "…" });
    $("kpis").innerHTML = kpiTiles(job.live_metrics, job.series, null);
  }

  function renderBars() {
    const done = history.filter(h => h.status === "done").slice(0, 12);
    if (!done.length) { $("bars").innerHTML = `<div class="empty">${esc(t("compareEmpty"))}</div>`; return; }
    const m = CFG.metrics.find(x => x.name === $("metricSel").value) || CFG.metrics[0];
    const vals = done.map(h => Number(h.metrics?.[m.name] ?? 0));
    const max = Math.max(...vals.map(Math.abs), 1e-9);
    $("bars").innerHTML = done.map((h, i) => `
      <div class="bar-row ${h.id === selectedId ? "current" : ""}" title="${esc(runName(h))}">
        <div class="name">${esc(runName(h))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(1, Math.abs(vals[i]) / max * 100)}%"></div></div>
        <div class="val">${fmt(vals[i], m.decimals ?? 1)} ${esc(L(m, "unit"))}</div>
      </div>`).join("");
  }

  function renderTable() {
    $("histCount").textContent = history.length ? String(history.length) : "";
    if (!history.length) { $("hist").innerHTML = `<tbody><tr><td class="l empty" colspan="99">${esc(t("noRuns"))}</td></tr></tbody>`; return; }
    const head = (o) => L(o, "label") + (L(o, "unit") ? ` (${L(o, "unit")})` : "");
    const pcols = otherParams().map(p => ({ name: p.name, label: head(p), d: p.type === "integer" ? 0 : 1 }));
    const mcols = CFG.metrics.map(m => ({ name: m.name, label: head(m), d: m.decimals ?? 1 }));
    const pill = (h) => {
      const map = { submitted: ["wait", "pSent"], queued: ["wait", "pQueued"], running: h.paused ? ["wait", "pPaused"] : ["running", "pRunning"], done: ["done", "pDone"],
                    error: isStopped(h) ? ["wait", "pStopped"] : ["error", "pFailed"] };
      const [c, k] = map[h.status] || ["error", "pFailed"];
      return `<span class="pill ${c}"${h.error ? ` title="${esc(errText(h.error))}"` : ""}>${esc(t(k))}</span>`;
    };
    const dev = (c) => c ? `${esc(c.os || "")}${c.browser ? ", " + esc(c.browser) : ""}<small>#${esc(c.device_id || "?")}</small>` : "—";
    const tz = (c) => c ? `${esc(c.utc_offset || "")}<small>${esc(c.timezone || "")}</small>` : "—";
    const th = (k, l) => `<th class="${l ? "l" : ""}">${esc(t(k))}</th>`;
    $("hist").innerHTML = `<thead><tr>${th("thScenario", 1)}${th("thStatus", 1)}${DI ? th("thPeriod", 1) : ""}${th("thBy", 1)}${th("thDevice", 1)}${th("thTz", 1)}${th("thSent", 1)}${th("thMode", 1)}${th("thDuration")}` +
      pcols.map(c => `<th>${esc(c.label)}</th>`).join("") + mcols.map(c => `<th>${esc(c.label)}</th>`).join("") + "</tr></thead><tbody>" +
      history.map(h => `<tr class="${h.id === selectedId ? "selected" : ""}" data-id="${esc(h.id)}" tabindex="0">
        <td class="l">${esc(runName(h))}</td>
        <td class="l">${pill(h)}</td>
        ${DI ? `<td class="l">${esc(periodLabel(h.parameters))}</td>` : ""}
        <td class="l who"><b>${esc(h.submitted_by || "—")}</b></td>
        <td class="l dev">${dev(h.client)}</td>
        <td class="l dev">${tz(h.client)}</td>
        <td class="l">${esc(when(h.submitted_at))}</td>
        <td class="l">${esc(t(h.mode === "fast" ? "modeFast" : "modeRun"))}</td>
        <td>${h.wall_seconds != null ? esc(t("tookRun", { s: fmt(h.wall_seconds, 0) }).replace(/[。.]$/, "")) : "—"}</td>
        ${pcols.map(c => `<td>${fmt(h.parameters?.[c.name], c.d, false)}</td>`).join("")}
        ${mcols.map(c => `<td>${fmt(h.metrics?.[c.name], c.d)}</td>`).join("")}</tr>`).join("") + "</tbody>";
    document.querySelectorAll("#hist tbody tr[data-id]").forEach(tr => {
      const open = () => {
        const j = history.find(h => h.id === tr.dataset.id); if (!j) return;
        if (j.status === "done") { showResult(j); if (!activeId) renderJob(j); outRunId = j.id; showTab("output"); return; }
        selectedId = j.id;
        if (ACTIVE.includes(j.status)) { showTab("input"); return; }
        if (!activeId) renderJob(j);
        renderTable();
      };
      tr.addEventListener("click", open);
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
    });
  }

  async function refreshHistory() {
    history = await T.history();
    renderBars(); renderTable();
    if (TAB === "output") renderOutput();
  }

  let lastSim = undefined;
  async function refreshSimStatus(useCached = false) {
    const st = useCached ? lastSim : await T.simStatus();
    lastSim = st;
    const el = $("simStatus"); el.hidden = false;
    let cls = "off", text;
    if (!st) text = t("simNever");
    else {
      const age = (Date.now() - new Date(st.updated_at).getTime()) / 1000;
      const limit = Math.max(300, (st.heartbeat_seconds || 30) * 8);
      const q = (st.queue || []).length;
      if (st.online && st.running) { cls = "busy"; text = q ? t("simBusyQ", { n: q }) : t("simBusy"); }
      else if (st.online && age < limit) { cls = "on"; text = t("simOn", { ago: ago(st.updated_at) }); }
      else text = t("simOff", { ago: ago(st.updated_at) });
    }
    el.className = `sim-status ${cls}`;
    $("simStatusText").textContent = text;
  }

  function renderConfigText() {
    const title = L(CFG, "title"), sub = L(CFG, "subtitle");
    document.title = title;
    $("title").textContent = title;
    $("subtitle").textContent = sub;
    const cur = $("metricSel").value;
    $("metricSel").innerHTML = CFG.metrics.map(m => `<option value="${esc(m.name)}">${esc(L(m, "label"))}</option>`).join("");
    if (cur) $("metricSel").value = cur;
  }

  // ---------- tabs ----------
  const TABS = ["input", "output", "history"];
  const TAB_IDS = { input: ["tabInput", "app"], output: ["tabOutput", "pageOutput"], history: ["tabHistory", "pageHistory"] };
  function showTab(tab, push = true) {
    TAB = TABS.includes(tab) ? tab : "input";
    TABS.forEach(k => { $(TAB_IDS[k][0]).setAttribute("aria-selected", String(k === TAB)); $(TAB_IDS[k][1]).hidden = k !== TAB; });
    if (push) { try { history_replace(TAB); } catch (e) {} }
    if (TAB === "output") renderOutput();
    if (TAB === "history") renderTable();
    window.scrollTo(0, 0);
  }
  function history_replace(tab) { if (location.hash !== "#" + tab) window.history.replaceState(null, "", "#" + tab); }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
  $("tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = TABS.indexOf(TAB), next = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
    showTab(next); $(TAB_IDS[next][0]).focus();
  });

  // ---------- output page ----------
  const doneRuns = () => history.filter(h => h.status === "done");
  const tableDefs = () => CFG.tables || [];

  function numericCols(tb, def) {
    const keys = new Set((def?.key_columns || []).map(String));
    return tb.columns.map((c, i) => ({ c, i })).filter(({ c, i }) =>
      !keys.has(c) && (!tb.rows.length || tb.rows.every(r => typeof r.values[i] === "number")));
  }
  const keyIdx = (tb, def) => tb.columns.findIndex(c => (def?.key_columns || []).includes(c));

  let OUT_CAT = load("simOutCat") || "overview";
  const outViews = () => CFG.output_views || [];
  function renderOutNav(job) {
    const cats = [{ k: "overview", label: t("catOverview"), sub: "" },
      ...outViews().map(v => ({ k: v.name, label: L(v, "label"), sub: tableDefs().filter(d => d.view === v.name).map(d => L(d, "product_label") || L(d, "label")).join(", ") })),
      ...(CFG.oee ? [{ k: "oee", label: "OEE", sub: "OEE1, OEE2" }] : []),
      ...(CFG.utilization ? [{ k: "util", label: t("catUtil"), sub: [...new Set(CFG.utilization.groups.map(g => L(g, "label")))].join(", ") }] : [])];
    if (!cats.find(c => c.k === OUT_CAT)) OUT_CAT = "overview";
    $("outNav").innerHTML = `<div class="grp">${esc(t("grpOutputs"))}</div>` + cats.map(c =>
      `<button type="button" data-k="${esc(c.k)}" aria-current="${c.k === OUT_CAT}"><b>${esc(c.label)}</b>${c.sub ? `<small>${esc(c.sub)}</small>` : ""}</button>`).join("");
    $("outNav").querySelectorAll("button").forEach(b => b.onclick = () => { OUT_CAT = b.dataset.k; store("simOutCat", OUT_CAT); renderOutput(); });
    document.querySelector('[data-ocat="overview"]').hidden = OUT_CAT !== "overview";
    document.querySelector('[data-ocat="view"]').hidden = ["overview", "util", "oee"].includes(OUT_CAT);
    document.querySelector('[data-ocat="util"]').hidden = OUT_CAT !== "util";
    document.querySelector('[data-ocat="oee"]').hidden = OUT_CAT !== "oee";
  }

  function renderRunInputs(job) {
    const box = $("runInputs"), parts = [];
    const fmtv = (v) => fmt(v, Number.isInteger(v) ? 0 : 2);
    if (job.plans) for (const [name, pl] of Object.entries(job.plans)) {
      const p = (PD()?.products || []).find(x => x.name === name);
      const sh = job.shifts?.[name];
      parts.push(`<div class="ri"><h3>${esc(p ? L(p, "label") : name)}</h3><dl>
        <dt>${esc(t("target"))}</dt><dd>${fmtv(pl.target)}</dd>
        <dt>${esc(t("sWorkDays"))}</dt><dd>${fmtv(pl.total_work_day)} / ${fmtv(pl.total_day)}</dd>
        <dt>${esc(t("sFilled"))}</dt><dd>${fmtv(pl.filled)}</dd>
        <dt>${esc(t("sPerDay"))}</dt><dd>${fmtv(pl.per_day)}</dd>
        ${sh ? `<dt>${esc(t("shiftCount"))}</dt><dd>${sh.count}</dd>` : ""}
      </dl></div>`);
    }
    box.innerHTML = parts.join("") || `<p class="empty">—</p>`;
  }

  function renderOutput() {
    if (!CFG) return;
    const runs = doneRuns();
    const has = runs.length > 0;
    $("outEmpty").hidden = true;
    $("outLayout").hidden = false;
    document.querySelector(".out-head").hidden = false;
    let job = null;
    if (has) {
      if (!runs.find(r => r.id === outRunId)) outRunId = runs[0].id;
      $("runSel").innerHTML = runs.map(r => `<option value="${esc(r.id)}">${esc(runName(r))}, ${esc(periodLabel(r.parameters))}</option>`).join("");
      $("runSel").value = outRunId;
      $("runSel").disabled = false;
      job = runs.find(r => r.id === outRunId);
      selectedId = job.id;
      const bits = [periodLabel(job.parameters)];
      if (job.submitted_by) bits.push(t("runBy", { who: job.submitted_by }).replace(/^[,，]\s*/, ""));
      if (job.wall_seconds) bits.push(t("tookRun", { s: fmt(job.wall_seconds, 0) }));
      $("outMeta").textContent = bits.join(LANG === "zh" ? "，" : ", ");
    } else {
      $("runSel").innerHTML = `<option>${esc(t("noRunOpt"))}</option>`;
      $("runSel").disabled = true;
      $("outMeta").textContent = t("outEmpty");
    }

    if (OUT_CAT === "overview") {

  // ---------- OEE ----------
  let oeeProd = load("simOeeProd"), oeeStation = load("simOeeStation"), oeeView = null;
  // one entry per simulated day: effective, total and planned hours for every station
  function oeeDays(job, prod) {
    const O = CFG.oee, src = O.products[prod];
    const t1 = job?.tables?.[src?.oee1], t2 = job?.tables?.[src?.oee2];
    if (!t1?.rows?.length) return null;
    const dates = rowDates(job, t1);
    if (dates.some(d => !d)) return null;
    const rest = {}; (job.plans?.[prod]?.rows || []).forEach(r => { rest[r.date] = !!r.holiday; });
    const sh = job.shifts?.[prod], S = CFG.shifts;
    const col = (tb, name) => tb ? tb.columns.findIndex(c => c === name) : -1;
    return t1.rows.map((r, i) => {
      const d = dates[i], iso = isoDay(d), off = !!rest[iso];
      const r2 = t2?.rows?.[i];
      const st = {};
      for (const s of O.stations) {
        const i1 = col(t1, s.name + "_OEE1"), i2 = col(t2, s.name + "_OEE2");
        const o1 = i1 >= 0 ? Number(r.values[i1]) || 0 : 0, o2 = r2 && i2 >= 0 ? Number(r2.values[i2]) || 0 : 0;
        const eff = o1 * 24;
        let planned;
        if (off) planned = 0;
        else if (sh && S) {
          const wr = S.rows.indexOf(WD3[d.getDay()]), sc = S.columns.indexOf(s.shift);
          planned = wr >= 0 && sc >= 0 ? sh.grids.reduce((a, g) => a + (Number(g?.[wr]?.[sc]) || 0), 0) : (o2 > 0 ? eff / o2 : 0);
        } else planned = o2 > 0 ? eff / o2 : 0;
        st[s.name] = { eff, total: 24, planned };
      }
      return { d, off, st };
    });
  }
  function oeeGroups(days) {
    if (outGran === "day") return days.map(x => ({ from: x.d, to: x.d, days: [x], off: x.off }));
    const groups = []; let cur = null, wk = 0;
    days.forEach(x => {
      const d = x.d;
      const key = outGran === "week" ? wk : outGran === "month" ? `${d.getFullYear()}-${d.getMonth()}` : `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
      if (!cur || cur.key !== key) { cur = { key, from: d, to: d, days: [] }; groups.push(cur); }
      cur.to = d; cur.days.push(x);
      if (outGran === "week" && d.getDay() === 0) wk++;

    return groups;
  }
  function oeeOf(days, name) {
    let eff = 0, total = 0, planned = 0;

    return { o1: total > 0 ? eff / total : null, o2: planned > 0 ? eff / planned : null };

  function periodName(g, n) {

      label: LANG === "zh" ? `${g.from.getMonth() + 1}月` : MON3[g.from.getMonth()], range };

  const pct = (v) => v == null ? "—" : fmt(v * 100, 1) + "%";

    const W = Math.max(320, box.clientWidth || 640), H = 260, m = { l: 46, r: 8, t: 10, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const peak = Math.max(1, ...data.map(d => Math.max(d.o1 || 0, d.o2 || 0)));

    for (let v = 0; v <= ymax + 1e-9; v += 0.25) { g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`; ax += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`; }
    g += "</g>";
    let bars = "", hits = "";

        });

      });
    } else {
      ax += `<text x="${(W + m.l) / 2}" y="${m.t + ph / 2}" text-anchor="middle" style="fill:var(--muted);font-size:14px">${esc(t("noData"))}</text>`;
    }

    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc($("oeeChartTitle").textContent)}">${g}<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${y(1)}" y2="${y(1)}"/>${ax}${bars}${hits}</svg>`;

          `${outGran === "day" ? "" : `<br>${esc(t("workDaysN", { n: d.work }))}`}<br>OEE1 <b>${pct(d.o1)}</b> &nbsp; OEE2 <b>${d.off ? esc(t("restShort")) : pct(d.o2)}</b>`;

    const head1 = `<tr><th class="k" rowspan="2">${esc(t("colPeriod"))}</th>${outGran === "day" ? "" : `<th class="k" rowspan="2">${esc(t("colDates"))}</th><th rowspan="2">${esc(t("colWorkDays"))}</th>`}` +

      `<tr><td class="k${r.allOff ? " rest" : ""}">${esc(r.pn.row)}</td>${outGran === "day" ? "" : `<td class="k">${esc(r.pn.range)}</td><td>${r.work}</td>`}` +

  // ---------- equipment utilization ----------
  const ST_VAR = { 2: "proc", 21: "setup", 31: "setup", 9: "op", 49: "op", 10: "tr", 14: "tr", 15: "tr", 4: "block", 26: "block", 48: "block",
    11: "down", 20: "down", 12: "down", 32: "down", 33: "down", 1: "idle", 6: "idle", 29: "idle", 37: "idle", 42: "idle" };
  const stColor = (n) => `var(--st-${ST_VAR[n] || "other"})`;
  let utilGroup = load("simUtilGroup");
  let utilProd = load("simUtilProd");
  let utilSorted = load("simUtilSort") === "1";
  function utilRows(job, g) {
    const U = CFG.utilization, ex = new Set(U.excluded_states.map(String)), used = new Set(U.utilized_states.map(String));
    const data = job?.utilization?.objects;
    return g.objects.filter(o => !data || data[o]).map(o => {
      const st = data?.[o];
      if (!st) return { name: o, segs: [], util: null };
      const keep = Object.entries(st).filter(([k, v]) => !ex.has(k) && v > 0);
      const denom = keep.reduce((a, [, v]) => a + v, 0);
      const work = keep.filter(([k]) => used.has(k)).reduce((a, [, v]) => a + v, 0);
      // working states first, then the rest in a fixed order, idle-like last
      const rank = (k) => used.has(k) ? -1000 + +k : (ST_VAR[k] === "idle" ? 1000 + +k : +k);
      const segs = keep.sort((a, b) => rank(a[0]) - rank(b[0])).map(([k, v]) => ({ k, v, p: denom ? v / denom : 0 }));
      return { name: o, segs, util: denom ? work / denom : null };
    });
  }
  function renderUtil(job) {
    const U = CFG.utilization, all = U.groups;

  function sparkVals(vals) {
    if (vals.length < 2) return "";
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(2)},${(26 - (v - lo) / span * 22).toFixed(2)}`).join(" ");

  }
  // ---------- day / week / month / quarter ----------
  const GRANS = ["day", "week", "month", "quarter"];
  let outGran = GRANS.includes(load("simOutGran")) ? load("simOutGran") : "day";
  let viewTb = null;  // what the chart and table show (for the CSV button)
  const MON_IDX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  // real date of each daily row: parse "Nov 2" with the run's year; fall back to start date + row index
  function rowDates(job, tb, def) {
    const di = tb.columns.findIndex(c => /date/i.test(c));
    const p = periodOf(job?.parameters || {});
    let year = p?.start ? p.start.getFullYear() : new Date().getFullYear(), lastM = -1;
    return tb.rows.map((r, i) => {
      const m = di >= 0 ? String(r.values[di]).trim().match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})/) : null;
      if (m && MON_IDX[m[1].toLowerCase()] != null) {
        const mi = MON_IDX[m[1].toLowerCase()];
        if (lastM > mi) year++;  // Dec -> Jan
        lastM = mi;
        return new Date(year, mi, +m[2]);
      }
      if (p?.start) { const d = new Date(p.start); d.setDate(d.getDate() + i); return d; }
      return null;
    });
  }
  const md = (d) => LANG === "zh" ? `${d.getMonth() + 1}/${d.getDate()}` : `${MON3[d.getMonth()]} ${d.getDate()}`;
  function rangeText(a, b) {
    if (+a === +b) return md(a);
    if (LANG !== "zh" && a.getMonth() === b.getMonth()) return `${md(a)}–${b.getDate()}`;
    return `${md(a)}–${md(b)}`;
  }
  function aggregate(job, tb, def) {
    if (outGran === "day" || !tb.rows.length) return { tb, def };
    const cols = numericCols(tb, def), dates = rowDates(job, tb, def);
    if (dates.some(d => !d)) return { tb, def };
    const groups = [];
    let cur = null, wk = 0;
    tb.rows.forEach((r, i) => {
      const d = dates[i];
      const key = outGran === "week" ? wk : outGran === "month" ? `${d.getFullYear()}-${d.getMonth()}` : `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
      if (!cur || cur.key !== key) { cur = { key, from: d, to: d, sums: cols.map(() => 0), work: 0 }; groups.push(cur); }
      cur.to = d;
      cols.forEach(({ i: ci }, k) => cur.sums[k] += Number(r.values[ci]) || 0);
      if (cols.some(({ i: ci }) => Number(r.values[ci]) > 0)) cur.work++;
      if (outGran === "week" && d.getDay() === 0) wk++;  // weeks end on Sunday, like the model's weekly summary
    });
    const cD = t("colDates"), cW = t("colWorkDays");
    const rows = groups.map((g, n) => {
      const range = rangeText(g.from, g.to);
      let row, label;
      if (outGran === "week") { row = t("weekN", { n: n + 1 }); label = range; }
      else if (outGran === "month") {
        row = LANG === "zh" ? `${g.from.getFullYear()}年${g.from.getMonth() + 1}月` : `${MON3[g.from.getMonth()]} ${g.from.getFullYear()}`;
        label = LANG === "zh" ? `${g.from.getMonth() + 1}月` : MON3[g.from.getMonth()];
      } else {
        const q = Math.floor(g.from.getMonth() / 3) + 1;
        row = `${g.from.getFullYear()} Q${q}`; label = `Q${q}`;
      }
      return { row, label, sub: `${outGran === "week" ? "" : range + "  "}${t("workDaysN", { n: g.work })}`, values: [range, g.work, ...g.sums] };
    });
    return { tb: { columns: [cD, cW, ...cols.map(c => c.c)], rows }, def: { ...def, key_columns: [cD, cW] } };
  }
  function renderGranSeg() {
    $("granSeg").innerHTML = GRANS.map(g => `<button type="button" data-g="${g}" aria-pressed="${g === outGran}">${esc(t("g_" + g))}</button>`).join("");
    $("granSeg").querySelectorAll("button").forEach(b => b.onclick = () => { outGran = b.dataset.g; store("simOutGran", outGran); renderOutput(); });
  }

  function renderTotals(tb, def) {
    const cols = numericCols(tb, def);
    const empty = !tb.rows.length;
    const workRows = tb.rows.filter(r => cols.some(({ i }) => r.values[i] > 0));
    $("totals").innerHTML = cols.map(({ c, i }) => {
      const total = tb.rows.reduce((a, r) => a + r.values[i], 0);
      const avg = workRows.length ? total / workRows.length : 0;
      return `<button type="button" class="tile" data-s="${esc(c)}" aria-pressed="${c === outStation}">
        <span class="nm">${esc(c)}</span>
        <span class="tv">${empty ? "—" : fmt(total, 0)}</span>
        <span class="av">${empty ? "&nbsp;" : esc(t("avgShort", { v: fmt(avg, 0) }))}</span>
        ${empty ? "" : sparkVals(workRows.map(r => r.values[i]))}
      </button>`;
    }).join("");
    $("totals").querySelectorAll(".tile").forEach(b => b.onclick = () => { outStation = b.dataset.s; store("simOutStation", outStation); renderOutput(); });
  }

  function renderStations(tb, def) {
    const cols = numericCols(tb, def);
    if (!cols.find(x => x.c === outStation)) outStation = cols[0]?.c || null;
    $("stationChips").innerHTML = cols.map(({ c }) => `<button type="button" data-s="${esc(c)}" aria-pressed="${c === outStation}">${esc(c)}</button>`).join("");
    $("stationChips").querySelectorAll("button").forEach(b => b.onclick = () => { outStation = b.dataset.s; renderOutput(); });
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

  function renderDaily(tb, def) {
    const col = numericCols(tb, def).find(x => x.c === outStation);
    const box = $("dailyChart");
    if (!col) { box.innerHTML = ""; return; }
    if (!tb.rows.length) {
      $("chartTitle").textContent = t(outGran === "day" ? "chartTitle" : "ct_" + outGran, { s: col.c }); $("chartLegend").innerHTML = "";
      const W = Math.max(320, box.clientWidth || 640), H = 260, m = { l: 46, r: 8, t: 10, b: 30 }, ph = H - m.t - m.b;
      let g = '<g class="grid">', ax = '<g class="axis">';
      for (let k = 0; k <= 4; k++) { const yy = m.t + ph - ph * k / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>`; ax += `<text x="${m.l - 8}" y="${yy + 4}" text-anchor="end">—</text>`; }
      box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("noData"))}">${g}</g>${ax}</g>
        <text x="${(W + m.l) / 2}" y="${m.t + ph / 2}" text-anchor="middle" style="fill:var(--muted);font-size:14px">${esc(t("noData"))}</text></svg>`;
      return;
    }
    const ki = keyIdx(tb, def);
    const wi = tb.columns.findIndex((c, i) => i !== ki && (def?.key_columns || []).includes(c));
    const data = tb.rows.map(r => ({ label: r.label ?? (ki >= 0 ? String(r.values[ki]) : r.row), sub: r.sub ?? (wi >= 0 ? String(r.values[wi]) : ""), v: r.values[col.i], row: r.row }));
    const W = Math.max(320, box.clientWidth || 640), H = 260, m = { l: 46, r: 8, t: 10, b: 30 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const peak = Math.max(...data.map(d => d.v), 0);
    const rawStep = peak > 0 ? peak / 4 : 1, mag = Math.pow(10, Math.floor(Math.log10(rawStep))), n = rawStep / mag;
    const stepY = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
    const ymax = Math.max(stepY, Math.ceil(peak / stepY) * stepY);
    const work = data.filter(d => d.v > 0), avg = work.length ? work.reduce((a, d) => a + d.v, 0) / work.length : 0;
    const day = outGran === "day";
    $("chartTitle").textContent = t(day ? "chartTitle" : "ct_" + outGran, { s: col.c });
    $("chartLegend").innerHTML = `<span class="lg-bar"></span>${esc(t(day ? "lgDaily" : "lg_" + outGran))}<span class="lg-avg"></span>${esc(t(day ? "avgWork" : "av_" + outGran, { v: fmt(avg, 0) }))}`;
    const y = (v) => m.t + ph - (v / ymax) * ph;
    const step = pw / data.length, bw = Math.max(1, Math.min(28, step - 2));
    let g = '<g class="grid">', ax = '<g class="axis">';
    for (let v = 0; v <= ymax + 1e-9; v += stepY) {
      const yy = y(v);
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>`;
      ax += `<text x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${fmt(v, stepY >= 1 ? 0 : 1)}</text>`;
    }
    g += "</g>";
    const every = Math.max(1, Math.ceil(data.length / Math.floor(pw / 64)));
    data.forEach((d, i) => { if (i % every === 0) ax += `<text x="${m.l + step * i + step / 2}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`; });
    ax += "</g>";
    let bars = "", hits = "";
    data.forEach((d, i) => {
      const x = m.l + step * i + (step - bw) / 2;
      if (d.v > 0) {
        const h = Math.max(1, ph - (y(d.v) - m.t));
        bars += `<path class="bar" data-i="${i}" d="M${x},${m.t + ph} v${-(h - Math.min(2, h))} q0,-2 2,-2 h${bw - 4} q2,0 2,2 v${h - Math.min(2, h)} z"/>`;
      } else {
        bars += `<rect class="zero" x="${x}" y="${m.t + ph - 1}" width="${bw}" height="1"/>`;
      }
      hits += `<rect class="hit" data-i="${i}" x="${m.l + step * i}" y="${m.t}" width="${step}" height="${ph}"/>`;
    });
    const ay = y(avg);
    const avgLine = avg > 0 ? `<line class="avg" x1="${m.l}" x2="${W - m.r}" y1="${ay}" y2="${ay}"/>` : "";
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chartTitle", { s: col.c }))}">${g}${ax}${bars}${avgLine}${hits}</svg>`;
    const tip = $("tip");
    box.querySelectorAll(".hit").forEach(h => {
      h.addEventListener("mousemove", (e) => {
        const d = data[+h.dataset.i];
        box.querySelectorAll(".bar").forEach(b => b.classList.toggle("hot", b.dataset.i === h.dataset.i));
        tip.innerHTML = `${esc(d.row && outGran !== "day" ? d.row + "  " : "")}${esc(d.label)}${d.sub ? `<br>${esc(d.sub)}` : ""}<br><b>${fmt(d.v, 0)}</b> ${esc(col.c)}`;
        tip.hidden = false;
        const tw = tip.offsetWidth;
        tip.style.left = Math.min(window.innerWidth - tw - 8, e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 54) + "px";
      });
      h.addEventListener("mouseleave", () => { tip.hidden = true; box.querySelectorAll(".bar.hot").forEach(b => b.classList.remove("hot")); });
    });
  }
  let rsz = null;
  window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (TAB === "output") renderOutput(); }, 150); });

  function renderDailyTable(tb, def) {
    const nums = new Set(numericCols(tb, def).map(x => x.i));
    const cols = numericCols(tb, def);
    if (!tb.rows.length) {
      $("dailyTable").innerHTML = `<thead><tr><th class="k"></th>${tb.columns.map((c, i) => `<th class="${nums.has(i) ? "" : "k"}">${esc(c)}</th>`).join("")}</tr></thead>` +
        `<tbody><tr><td class="k empty" colspan="${tb.columns.length + 1}">${esc(t("noData"))}</td></tr></tbody>`;
      return;
    }
    $("dailyTable").innerHTML = `<thead><tr><th class="k"></th>${tb.columns.map((c, i) => `<th class="${nums.has(i) ? "" : "k"}">${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
      tb.rows.map(r => {
        const off = cols.length && cols.every(({ i }) => r.values[i] === 0);
        return `<tr><td class="k${off ? " off" : ""}">${esc(r.row)}</td>${r.values.map((v, i) =>
          `<td class="${nums.has(i) ? "" : "k"}${off ? " off" : ""}">${nums.has(i) ? fmt(v, Number.isInteger(v) ? 0 : 1) : esc(v)}</td>`).join("")}</tr>`;
      }).join("") + "</tbody>";
  }

  $("tableCsvBtn").addEventListener("click", () => {
    const job = doneRuns().find(r => r.id === outRunId); const tb = viewTb;
    if (!job || !tb || !tb.rows.length) return;
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [["", ...tb.columns].map(q).join(","), ...tb.rows.map(r => [r.row, ...r.values].map(q).join(","))];
    const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `${outTable}_${outGran}_${(job.label || job.id).replace(/[^\w\u4e00-\u9fff-]+/g, "_")}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // ---------- language switch ----------
  function setLang(lang) {
    if (lang === LANG) return;
    LANG = lang; store("simLang", lang);
    applyStatic();
    if (!CFG) return;
    const vals = currentFormValues();
    renderConfigText();
    buildForm(vals);
    const sel = history.find(h => h.id === selectedId && h.status === "done");
    if (sel) showResult(sel); else { clearResults(); renderBars(); renderTable(); }
    if (stateMode === "job" && shownJob) renderJob(shownJob); else setIdle();
    refreshSimStatus(true).catch(() => {});
    if (TAB === "output") renderOutput();
    renderInNav(); if (IN_CAT === "shift") renderShifts();
  }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  $("metricSel").addEventListener("change", renderBars);

  // ---------- admin: clear run history ----------
  async function sha256hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
  }
  function adminMsg(text, ok) { $("adminMsg").hidden = !text; $("adminMsg").textContent = text || ""; $("adminMsg").classList.toggle("ok", !!ok); }
  $("clearHistBtn").addEventListener("click", async () => {
    const code = prompt(t("adminPrompt"));
    if (!code) return;
    const id = "clear-" + T.newId();
    try {
      // 代碼本身不寫進共用資料夾，只送「代碼＋這次要求編號」的雜湊，模擬電腦用同樣方式比對
      const hash = await sha256hex(code.trim() + ":" + id);
      await T.admin(id, { action: "clear_history", hash, by: $("f_who").value.trim() || null, at: new Date().toISOString() });
    } catch (e) { adminMsg(e.message); return; }
    adminMsg(t("adminSent"));
    $("clearHistBtn").disabled = true;
    const t0 = Date.now();
    const tick = async () => {
      const r = await T.adminResult(id).catch(() => null);
      if (r) {
        $("clearHistBtn").disabled = false;
        const map = { ok: ["adminOk", true], bad_code: ["adminBad"], locked: ["adminLocked"], disabled: ["adminOff"], busy: ["adminBusy"] };
        const [k, ok] = map[r.status] || ["adminBad"];
        adminMsg(t(k, { n: r.archived ?? 0 }), ok);
        if (r.status === "ok") { outRunId = null; selectedId = null; await refreshHistory(); clearResults(); }
        return;
      }
      if (Date.now() - t0 > 180000) { $("clearHistBtn").disabled = false; adminMsg(t("adminTimeout")); return; }
      setTimeout(tick, 3000);
    };
    setTimeout(tick, 3000);
  });

  $("csvBtn").addEventListener("click", () => {
    const head = ["scenario", "submitted_by", "device_id", "os", "browser", "timezone", "utc_offset", "submitted_at", "status", "mode", "run_seconds", ...(DI ? ["period"] : []),
      ...CFG.parameters.map(p => p.name), ...CFG.metrics.map(m => m.name)];
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = history.map(h => [runName(h), h.submitted_by, h.client?.device_id, h.client?.os, h.client?.browser, h.client?.timezone, h.client?.utc_offset,
      h.submitted_at, h.status, h.mode || "run", h.wall_seconds, ...(DI ? [periodLabel(h.parameters)] : []),
      ...CFG.parameters.map(p => h.parameters?.[p.name]), ...CFG.metrics.map(m => h.metrics?.[m.name])].map(q).join(","));
    const blob = new Blob(["﻿" + [head.join(","), ...rows].join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "simulation_runs.csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  (async function init() {
    applyStatic();
    try {
      T = folderTransport(await connectFolder());
      CFG = await T.getConfig();
      DI = CFG.date_inputs || null;
      renderConfigText();
      $("mockBanner").hidden = !CFG.mock_mode;
      $("f_who").value = load("simWho") || "";
      $("f_label").value = load("simLabel") || "";
      let saved = null;
      try { saved = JSON.parse(load("simLastParams") || "null"); } catch (e) {}
      buildForm(saved || defaults());
      clearResults(); setIdle();
      $("tabs").hidden = false;
      renderInNav(); renderShifts(); showInCat(IN_CAT);
      showTab((location.hash || "").slice(1), false);
      await refreshSimStatus();
      await refreshHistory();
      if (!saved) {
        const mine = history.find(h => h.client?.device_id && h.client.device_id === load("simDevice")) || history[0];
        if (restoreFromJob(mine)) { renderPlan(); renderShifts(); renderInNav(); }
      }
      const active = history.find(h => ACTIVE.includes(h.status));
      const lastDone = history.find(h => h.status === "done");
      if (lastDone) { showResult(lastDone); if (!active) renderJob(lastDone); }
      if (active) { activeId = selectedId = active.id; activeJob = active; if (active.mode !== "fast") showLive(active); renderJob(active); poll(active.id); }
      syncButtons();
      setInterval(() => refreshSimStatus().catch(() => {}), 10000);
      setInterval(() => { if (!activeId) refreshHistory().catch(() => {}); }, 30000);
    } catch (err) {
      $("connectCard").hidden = true;
      $("subtitle").textContent = err.message;
    }
  })();
})();
</script>
</body>
</html>
